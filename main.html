<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人杀模拟器 Pro Max</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .terminal {
            font-family: 'Consolas', 'Monaco', monospace;
            background: #1a1a2e;
            color: #eee;
        }
        .log-night { color: #a78bfa; }
        .log-day { color: #fbbf24; }
        .log-death { color: #f87171; }
        .log-wolf { color: #ef4444; }
        .log-good { color: #34d399; }
        .log-third { color: #f472b6; }
        .log-system { color: #60a5fa; }
        .log-input { color: #22d3ee; }
        .log-police { color: #fb923c; }
        .log-skill { color: #c084fc; }
        .role-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            margin: 2px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .role-tag:hover { transform: scale(1.05); }
        .role-good { background: #166534; }
        .role-wolf { background: #991b1b; }
        .role-third { background: #86198f; }
        .collapse-btn { cursor: pointer; user-select: none; }
        .collapse-content { max-height: 0; overflow: hidden; transition: max-height 0.3s; }
        .collapse-content.open { max-height: 2000px; }
        .action-btn {
            transition: all 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen text-white">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <h1 class="text-3xl font-bold text-center mb-6 text-purple-400">🐺 狼人杀模拟器 Pro Max</h1>
        
        <!-- 配置面板 -->
        <div id="configPanel" class="bg-gray-800 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4 text-yellow-400">⚙️ 游戏配置</h2>
            
            <!-- 角色选择区 -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold mb-3 text-green-400 collapse-btn" onclick="toggleCollapse('goodRoles')">
                    👼 好人阵营 <span class="text-sm">(点击展开/收起)</span>
                </h3>
                <div id="goodRoles" class="collapse-content open flex flex-wrap gap-1 mb-4"></div>
                
                <h3 class="text-lg font-semibold mb-3 text-red-400 collapse-btn" onclick="toggleCollapse('wolfRoles')">
                    🐺 狼人阵营 <span class="text-sm">(点击展开/收起)</span>
                </h3>
                <div id="wolfRoles" class="collapse-content open flex flex-wrap gap-1 mb-4"></div>
                
                <h3 class="text-lg font-semibold mb-3 text-pink-400 collapse-btn" onclick="toggleCollapse('thirdRoles')">
                    🎭 第三方阵营 <span class="text-sm">(点击展开/收起)</span>
                </h3>
                <div id="thirdRoles" class="collapse-content open flex flex-wrap gap-1 mb-4"></div>
            </div>
            
            <!-- 已选角色 -->
            <div class="mb-4 p-3 bg-gray-700 rounded">
                <label class="block text-sm mb-2">已选角色 (点击上方角色添加，点击下方移除)</label>
                <div id="selectedRoles" class="flex flex-wrap gap-1 min-h-8"></div>
            </div>
            
            <!-- 快速配置 -->
            <div class="mb-4">
                <label class="block text-sm mb-2">快速配置模板</label>
                <div class="flex flex-wrap gap-2">
                    <button onclick="quickConfig('6人标准')" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-sm">6人标准</button>
                    <button onclick="quickConfig('9人标准')" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-sm">9人标准</button>
                    <button onclick="quickConfig('12人标准')" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-sm">12人标准</button>
                    <button onclick="quickConfig('预女猎守')" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-sm">预女猎守</button>
                    <button onclick="quickConfig('狼美人局')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm">狼美人局</button>
                    <button onclick="quickConfig('屠边局')" class="bg-purple-600 hover:bg-purple-700 px-3 py-1 rounded text-sm">屠边局</button>
                    <button onclick="clearRoles()" class="bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-sm">清空</button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-sm mb-2">分配模式</label>
                    <select id="mode" class="w-full bg-gray-700 rounded px-3 py-2 text-white">
                        <option value="order">顺序分配 (order)</option>
                        <option value="random">随机分配 (random)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm mb-2">警长规则</label>
                    <select id="police" class="w-full bg-gray-700 rounded px-3 py-2 text-white">
                        <option value="none">无警长</option>
                        <option value="single">单曝吞警徽</option>
                        <option value="double">双曝吞警徽</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm mb-2">狼人胜利条件</label>
                    <div class="flex flex-wrap gap-2 mt-1">
                        <label class="flex items-center text-sm">
                            <input type="checkbox" id="winNumber" checked class="mr-1"> 数量压制
                        </label>
                        <label class="flex items-center text-sm">
                            <input type="checkbox" id="winEdge" class="mr-1"> 屠边
                        </label>
                        <label class="flex items-center text-sm">
                            <input type="checkbox" id="winCity" class="mr-1"> 屠城
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- 计分系统 -->
            <div class="mb-4 p-3 bg-gray-700 rounded">
                <label class="block text-sm mb-2 text-yellow-400">📊 计分系统</label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <select id="scoreMode" class="w-full bg-gray-600 rounded px-3 py-2 text-white" onchange="updateScoreOptions()">
                            <option value="none">不计分</option>
                            <option value="noVote">计分（不含投票分）</option>
                            <option value="withVote">计分（含投票分）</option>
                        </select>
                        <div id="scoreWarning" class="text-xs text-red-400 mt-1 hidden">⚠️ 当前角色配置不支持计分</div>
                    </div>
                    <div>
                        <label class="flex items-center text-sm" id="tieVoteOption">
                            <input type="checkbox" id="continueScoreAfterTie" class="mr-2"> 狼人绑票后继续计算行为分和投票分
                        </label>
                    </div>
                </div>
            </div>
            
            <button onclick="startGame()" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-lg font-semibold transition">
                🎮 开始游戏
            </button>
        </div>
        
        <!-- 游戏终端 -->
        <div id="gameArea" class="hidden">
            <div class="terminal rounded-lg p-4 mb-4 h-[450px] overflow-y-auto" id="terminal"></div>
            
            <!-- 白天技能按钮区 -->
            <div id="daySkillArea" class="hidden bg-purple-900/50 rounded-lg p-4 mb-4">
                <div class="text-purple-400 font-semibold mb-2">⚔️ 白天技能</div>
                <div id="daySkillButtons" class="flex flex-wrap gap-2"></div>
            </div>
            
            <!-- 自爆按钮区 -->
            <div id="explodeArea" class="hidden bg-red-900/50 rounded-lg p-4 mb-4">
                <div class="text-red-400 font-semibold mb-2">💥 狼人自爆</div>
                <div id="explodeButtons" class="flex flex-wrap gap-2"></div>
            </div>
            
            <!-- 输入区域 -->
            <div id="inputArea" class="hidden bg-gray-800 rounded-lg p-4">
                <div id="inputPrompt" class="text-cyan-400 mb-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="playerInput" 
                        class="flex-1 bg-gray-700 rounded px-3 py-2 text-white"
                        placeholder="输入数字..."
                        onkeypress="if(event.key==='Enter')submitInput()">
                    <button onclick="submitInput()" class="bg-cyan-600 hover:bg-cyan-700 px-6 py-2 rounded transition">
                        确认
                    </button>
                </div>
                <div id="inputHint" class="text-sm text-gray-400 mt-2"></div>
            </div>
            
            <!-- 控制按钮 -->
            <div class="flex gap-2 mt-4">
                <button onclick="resetGame()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded transition">
                    🔄 重新开始
                </button>
                <button onclick="exportLog()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded transition">
                    📋 导出记录
                </button>
                <button id="showScoreBtn" onclick="showScorePanel()" class="bg-yellow-600 hover:bg-yellow-700 px-4 py-2 rounded transition hidden">
                    📊 查看积分
                </button>
            </div>
            
            <!-- 积分面板 -->
            <div id="scorePanel" class="hidden bg-gray-800 rounded-lg p-4 mt-4">
                <h3 class="text-xl font-semibold mb-4 text-yellow-400">📊 本局积分</h3>
                <div id="scoreSummary" class="mb-4"></div>
                <div id="scoreDetails" class="hidden">
                    <h4 class="text-lg font-semibold mb-2 text-cyan-400">详细加分情况</h4>
                    <div id="scoreDetailsList" class="max-h-80 overflow-y-auto"></div>
                </div>
                <button onclick="toggleScoreDetails()" class="bg-cyan-600 hover:bg-cyan-700 px-4 py-2 rounded mt-2">
                    显示/隐藏详情
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 角色定义 ====================
        const ROLES = {
            // ===== 好人阵营 - 平民 =====
            '平民': { team: 'good', type: 'villager', desc: '无特殊技能' },
            '羊驼': { team: 'good', type: 'villager', desc: '无特殊技能(平民变体)' },
            '老流氓': { team: 'good', type: 'villager', desc: '被毒或射杀延迟一天死亡' },
            
            // ===== 好人阵营 - 神职 =====
            '预言家': { team: 'good', type: 'god', nightAction: true, desc: '每晚查验一人身份' },
            '女巫': { team: 'good', type: 'god', nightAction: true, desc: '有解药和毒药各一瓶' },
            '猎人': { team: 'good', type: 'god', deathAction: true, desc: '被杀或放逐可开枪带人' },
            '守卫': { team: 'good', type: 'god', nightAction: true, desc: '每晚守护一人免受狼刀' },
            '白痴': { team: 'good', type: 'god', voteAction: true, desc: '被放逐可翻牌免死但失去投票权' },
            '摄梦人': { team: 'good', type: 'god', nightAction: true, desc: '每晚指定梦游者免疫夜间伤害' },
            '乌鸦': { team: 'good', type: 'god', nightAction: true, desc: '每晚诅咒一人次日多一票' },
            '魔术师': { team: 'good', type: 'god', nightAction: true, desc: '每晚交换两人号码牌' },
            '骑士': { team: 'good', type: 'god', dayAction: true, desc: '白天可翻牌决斗一人' },
            '禁言长老': { team: 'good', type: 'god', nightAction: true, desc: '每晚可禁言一人' },
            '守墓人': { team: 'good', type: 'god', nightAction: true, desc: '夜晚得知被放逐者阵营' },
            '猎魔人': { team: 'good', type: 'god', nightAction: true, desc: '每晚狩猎一人,猎中狼则狼死' },
            '奇迹商人': { team: 'good', type: 'god', nightAction: true, desc: '给一人赐予一次性技能' },
            '纯白之女': { team: 'good', type: 'god', nightAction: true, desc: '查验具体身份,第二夜起查狼则狼死' },
            '定序王子': { team: 'good', type: 'god', voteAction: true, desc: '可重置一次投票' },
            '熊': { team: 'good', type: 'god', passiveAction: true, desc: '天亮时若相邻有狼则咆哮' },
            '河豚': { team: 'good', type: 'god', voteAction: true, desc: '被放逐可带走投票者' },
            '白猫': { team: 'good', type: 'god', deathAction: true, desc: '出局时可额外存活至下次投票后' },
            '魔镜少女': { team: 'good', type: 'god', nightAction: true, desc: '查验具体身份' },
            
            // ===== 狼人阵营 =====
            '狼人': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, desc: '普通狼人' },
            '狼美人': { team: 'wolf', type: 'wolf', canExplode: false, canSelfKill: false, nightAction: true, desc: '魅惑好人,死亡时被魅者殉情' },
            '狼王': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, deathAction: true, desc: '出局可带走一人' },
            '白狼王': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, explodeAction: true, desc: '自爆时可带走一人' },
            '隐狼': { team: 'wolf', type: 'wolf', canExplode: false, canSelfKill: false, isHidden: true, desc: '查验为好人,不参与袭击' },
            '恶灵骑士': { team: 'wolf', type: 'wolf', canExplode: false, canSelfKill: false, hasCounter: true, desc: '免疫夜间伤害,有反伤' },
            '石像鬼': { team: 'wolf', type: 'wolf', canExplode: false, canSelfKill: false, isHidden: true, nightAction: true, desc: '不入狼队,可查验身份' },
            '血月使徒': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, explodeAction: true, desc: '自爆后封印好人技能' },
            '噩梦之影': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, nightAction: true, desc: '每晚恐惧一人使其无法用技能' },
            '狼巫': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, nightAction: true, desc: '查验好人身份' },
            '夜之贵族': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, nightAction: true, desc: '指定夜仆次夜死亡' },
            '觉醒狼王': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, deathAction: true, nightAction: true, desc: '有两次狼王爪可传给队友' },
            '蚀时狼妃': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, nightAction: true, desc: '封锁一人使好人技能对其视为对自身释放' },
            '狼鸦之爪': { team: 'wolf', type: 'wolf', canExplode: false, canSelfKill: false, isHidden: true, nightAction: true, desc: '封印状态,狼少于3人解封,可无视保护袭击' },
            '寂夜导师': { team: 'wolf', type: 'wolf', canExplode: false, canSelfKill: false, isHidden: true, nightAction: true, desc: '不入狼队,可增幅或削弱目标' },
            '蚀日侍女': { team: 'wolf', type: 'wolf', canExplode: false, canSelfKill: false, isHidden: true, nightAction: true, desc: '不入狼队,可吞噬非狼人获得技能' },
            '寻香魅影': { team: 'wolf', type: 'wolf', canExplode: false, canSelfKill: false, isHidden: true, nightAction: true, desc: '不入狼队,可绑定两人一同出局' },
            '觉醒隐狼': { team: 'wolf', type: 'wolf', canExplode: false, canSelfKill: false, isHidden: true, nightAction: true, desc: '可模仿一人获得其身份技能' },
            '觉醒狼美人': { team: 'wolf', type: 'wolf', canExplode: false, canSelfKill: false, nightAction: true, desc: '首次出局由被魅惑者替代' },
            '觉醒石像鬼': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, nightAction: true, desc: '首夜转化相邻好人为狼人' },
            '觉醒白狼王': { team: 'wolf', type: 'wolf', canExplode: true, canSelfKill: true, dayAction: true, desc: '可诱导一人自曝并带人' },

            // ===== 第三方阵营 =====
            '丘比特': { team: 'third', type: 'third', nightAction: true, desc: '连接情侣,情侣跨阵营则第三方' },
            '咒狐': { team: 'third', type: 'third', desc: '免疫狼刀,被验则死,最后存活获胜' },
            '暗恋者': { team: 'third', type: 'third', nightAction: true, desc: '暗恋一人与其胜利条件相同' },
            '野孩子': { team: 'third', type: 'third', nightAction: true, desc: '榜样被放逐则变狼' },
            '吹笛者': { team: 'third', type: 'third', nightAction: true, desc: '迷惑所有人则单独获胜' },
            '千面人': { team: 'third', type: 'third', nightAction: true, desc: '首夜从两张牌中选一张作为身份' },
            '觉醒暗恋者': { team: 'third', type: 'third', nightAction: true, desc: '偶像被放逐变狼,其他原因出局则继承身份' },
            '炸弹人': { team: 'third', type: 'third', voteAction: true, desc: '被放逐时炸死所有投票者' },
            // ===== 好人阵营补充 =====
            '子狐': { team: 'good', type: 'god', nightAction: true, desc: '一次性迷惑狼人使狼队无法袭击' },
            '炼金魔女': { team: 'good', type: 'god', nightAction: true, desc: '未明之雾限定狼人目标,法老之蛇救人' },
            '白昼学者': { team: 'good', type: 'god', nightAction: true, desc: '可增幅或削弱目标技能' },
            '流光伯爵': { team: 'good', type: 'god', nightAction: true, desc: '流光庇护使目标免疫夜间伤害' },
            '觉醒预言家': { team: 'good', type: 'god', nightAction: true, desc: '每晚窥视两人判断是否有狼' },
            '觉醒愚者': { team: 'good', type: 'god', nightAction: true, voteAction: true, desc: '秘密之身可保护自己或他人' },
            '觉醒女巫': { team: 'good', type: 'god', nightAction: true, desc: '三次毒药需协助者同意' },
            '觉醒猎人': { team: 'good', type: 'god', deathAction: true, desc: '出局后巡猎最近狼人' },
            '觉醒守卫': { team: 'good', type: 'god', nightAction: true, dayAction: true, desc: '觉醒守护可完全免疫出局' }
        };

        // 已选角色列表
        let selectedRolesList = [];
        
        // 可计分角色列表
        const SCORABLE_ROLES = ['狼人', '狼王', '狼美人', '狼巫', '噩梦之影', '平民', '女巫', '预言家', '守卫', '猎人', '摄梦人', '骑士', '纯白之女', '猎魔人'];
        
        // 游戏状态
        let game = {};
        
        // 计分系统
        let scoring = {
            enabled: false,
            withVote: false,
            continueAfterTie: false,
            tieDetected: false,
            players: {} // { playerId: { winScore: 0, behaviorScore: 0, voteScore: 0, policeScore: 0, details: [] } }
        };
        
        // 检查是否可以计分
        function canEnableScoring() {
            return selectedRolesList.every(role => SCORABLE_ROLES.includes(role));
        }
        
        // 更新计分选项状态
        function updateScoreOptions() {
            const scoreMode = document.getElementById('scoreMode');
            const warning = document.getElementById('scoreWarning');
            const tieOption = document.getElementById('tieVoteOption');
            
            if (scoreMode.value !== 'none' && !canEnableScoring()) {
                warning.classList.remove('hidden');
                scoreMode.value = 'none';
            } else {
                warning.classList.add('hidden');
            }
            
            if (scoreMode.value !== 'none') {
                tieOption.classList.remove('opacity-50');
            } else {
                tieOption.classList.add('opacity-50');
            }
        }
        
        // 初始化计分
        function initScoring() {
            const scoreMode = document.getElementById('scoreMode').value;
            scoring = {
                enabled: scoreMode !== 'none',
                withVote: scoreMode === 'withVote',
                continueAfterTie: document.getElementById('continueScoreAfterTie').checked,
                tieDetected: false,
                players: {}
            };
            
            if (scoring.enabled) {
                game.players.forEach(p => {
                    scoring.players[p.id] = {
                        winScore: 0,
                        behaviorScore: 0,
                        voteScore: 0,
                        policeScore: 0,
                        details: []
                    };
                });
            }
        }
        
        // 添加分数
        function addScore(playerId, type, amount, reason) {
            if (!scoring.enabled) return;
            if (scoring.tieDetected && !scoring.continueAfterTie && (type === 'behaviorScore' || type === 'voteScore')) return;
            
            const ps = scoring.players[playerId];
            if (!ps) return;
            
            ps[type] += amount;
            ps.details.push({ type, amount, reason });
        }
        
        // 检查绑票
        function checkTieVote() {
            const alivePlayers = getAlivePlayers();
            let wolfVotes = 0;
            let goodVotes = 0;
            
            alivePlayers.forEach(p => {
                if (p.idiotRevealed) return; // 白痴翻牌失去投票权
                const team = ROLES[p.role]?.team;
                if (team === 'wolf' || p.isConvertedWolf) {
                    wolfVotes += 1;
                    if (p.id === game.sheriff) wolfVotes += 0.5;
                } else if (team === 'good') {
                    goodVotes += 1;
                    if (p.id === game.sheriff) goodVotes += 0.5;
                }
            });
            
            if (wolfVotes >= goodVotes && !scoring.tieDetected) {
                scoring.tieDetected = true;
                log(`⚠️ 狼人阵营绑票！(狼${wolfVotes}票 vs 好人${goodVotes}票)`, 'wolf');
                return true;

        // 详细投票功能
        async function detailedVoting(alivePlayers) {
            log(`【详细投票】`, 'system');
            
            const votes = {}; // { voterId: targetId }
            const voteCounts = {}; // { targetId: count }
            
            // 收集每个人的投票
            for (const voter of alivePlayers) {
                if (voter.idiotRevealed) {
                    log(`${voter.id}${voter.role} 已翻牌，无投票权`, 'system');
                    continue;
                }
                
                const hint = `${voter.id}${voter.role}投票给: ${alivePlayers.map(p => p.id).join(',')} (0=弃票, -1=自爆)`;
                const target = await getInput(`<${voter.id}${voter.role}>投票:`, hint, alivePlayers.map(p => p.id).concat([0, -1]));
                
                if (target === -1) {
                    return -1; // 触发自爆
                }
                
                votes[voter.id] = target;
                log(`<${voter.id}${voter.role}>投票:${target}`, 'input');
                
                if (target > 0) {
                    const voteWeight = (voter.id === game.sheriff) ? 1.5 : 1;
                    const curseExtra = (voter.cursed) ? 0 : 0; // 乌鸦诅咒是给被诅咒者多一票，不是投票者
                    voteCounts[target] = (voteCounts[target] || 0) + voteWeight;
                }
            }
            
            // 处理乌鸦诅咒（被诅咒者多一票）
            alivePlayers.forEach(p => {
                if (p.cursed && voteCounts[p.id]) {
                    voteCounts[p.id] += 1;
                }
            });
            
            // 找出票数最多的
            let maxVotes = 0;
            let maxTargets = [];
            for (const [targetId, count] of Object.entries(voteCounts)) {
                if (count > maxVotes) {
                    maxVotes = count;
                    maxTargets = [parseInt(targetId)];
                } else if (count === maxVotes) {
                    maxTargets.push(parseInt(targetId));
                }
            }
            
            // 显示投票结果
            log(`投票结果: ${Object.entries(voteCounts).map(([id, c]) => `${id}号${c}票`).join(' ')}`, 'system');
            
            // 计算投票分
            for (const [voterId, targetId] of Object.entries(votes)) {
                if (targetId <= 0) continue;
                const voter = findPlayerById(parseInt(voterId));
                const target = findPlayerById(targetId);
                
                // 预言家、纯白之女、狼人阵营、第三方阵营不记投票分
                if (!voter || !target) continue;
                const voterTeam = ROLES[voter.role]?.team;
                if (voter.role === '预言家' || voter.role === '纯白之女' || voterTeam === 'wolf' || voterTeam === 'third') continue;
                
                const targetTeam = ROLES[target.role]?.team;
                if (targetTeam === 'wolf' || target.isConvertedWolf) {
                    // 投票分上限+1
                    const ps = scoring.players[voter.id];
                    if (ps && ps.voteScore < 1) {
                        addScore(voter.id, 'voteScore', 0.5, `投票给狼人${target.id}`);
                    }
                } else if (targetTeam === 'good') {
                    addScore(voter.id, 'voteScore', -0.5, `投票给好人${target.id}`);
                }
            }
            
            // 平票处理
            if (maxTargets.length > 1) {
                log(`平票: ${maxTargets.join(',')}号`, 'system');
                
                // 平票PK
                const pkResult = await tieBreaker(alivePlayers, maxTargets, votes);
                return pkResult;
            }
            
            return maxTargets.length > 0 ? maxTargets[0] : 0;
        }
        
        // 平票PK
        async function tieBreaker(alivePlayers, tiedPlayers, firstVotes) {
            log(`【平票PK】${tiedPlayers.join(',')}号进行PK`, 'system');
            
            // 非平票玩家投票
            const voters = alivePlayers.filter(p => !tiedPlayers.includes(p.id) && !p.idiotRevealed);
            if (voters.length === 0) {
                log(`无人可投票，平安日`, 'system');
                return 0;
            }
            
            const pkVotes = {};
            const pkCounts = {};
            
            for (const voter of voters) {
                const hint = `${voter.id}${voter.role}PK投票: ${tiedPlayers.join(',')} (0=弃票)`;
                const target = await getInput(`<${voter.id}${voter.role}>PK投票:`, hint, tiedPlayers.concat([0]));
                
                pkVotes[voter.id] = target;
                log(`<${voter.id}${voter.role}>PK投票:${target}`, 'input');
                
                if (target > 0) {
                    const voteWeight = (voter.id === game.sheriff) ? 1.5 : 1;
                    pkCounts[target] = (pkCounts[target] || 0) + voteWeight;
                }
            }
            
            // 找出票数最多的
            let maxVotes = 0;
            let maxTargets = [];
            for (const [targetId, count] of Object.entries(pkCounts)) {
                if (count > maxVotes) {
                    maxVotes = count;
                    maxTargets = [parseInt(targetId)];
                } else if (count === maxVotes) {
                    maxTargets.push(parseInt(targetId));
                }
            }
            
            log(`PK投票结果: ${Object.entries(pkCounts).map(([id, c]) => `${id}号${c}票`).join(' ')}`, 'system');
            
            if (maxTargets.length > 1 || maxTargets.length === 0) {
                log(`PK再次平票，平安日`, 'system');
                return 0;
            }
            
            return maxTargets[0];
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

            if (!game.magician || !game.magician.currentSwap) return targetId;

        // 幸运儿使用奇迹商人赠送的技能
        async function useGiftSkill() {
            const luckyPlayers = game.players.filter(p => p.alive && p.giftSkill && !p.giftSkillUsed);
            for (const player of luckyPlayers) {
                if (player.giftSkill === '查验') {
                    const validTargets = getAlivePlayers().filter(p => p.id !== player.id);
                    const hint = `可选: ${validTargets.map(p => p.id).join(',')} (0=本夜不使用,保留技能)`;
                    const target = await getInput(`<${player.id}${player.role}(幸运儿)>查验:`, hint, validTargets.map(p => p.id).concat([0]));
                    if (target > 0) {
                        const realTarget = applyMagicianSwap(target);
                        const tp = findPlayerById(realTarget);
                        if (tp) {
                            const isHidden = ROLES[tp.role]?.isHidden;
                            const actualTeam = ROLES[tp.role]?.team;
                            const showTeam = (actualTeam === 'wolf' && !isHidden) ? '狼人阵营' : '好人阵营';
                            log(`<${player.id}${player.role}(幸运儿)>查验${target}结果:${showTeam}`, showTeam === '狼人阵营' ? 'wolf' : 'good');
                        }
                        player.giftSkillUsed = true; // 只有使用了才标记为已用
                    } else {
                        log(`<${player.id}${player.role}(幸运儿)>查验:保留技能`, 'system');
                    }
                } else if (player.giftSkill === '毒药') {
                    const validTargets = getAlivePlayers().filter(p => p.id !== player.id);
                    const hint = `可选: ${validTargets.map(p => p.id).join(',')} (0=本夜不使用,保留技能)`;
                    const target = await getInput(`<${player.id}${player.role}(幸运儿)>毒:`, hint, validTargets.map(p => p.id).concat([0]));
                    if (target > 0) {
                        const realTarget = applyMagicianSwap(target);
                        log(`<${player.id}${player.role}(幸运儿)>毒:${target}`, 'input');
                        game.nightDeaths.push({ id: realTarget, cause: 'giftPoison' });
                        player.giftSkillUsed = true; // 只有使用了才标记为已用
                    } else {
                        log(`<${player.id}${player.role}(幸运儿)>毒:保留技能`, 'system');
                    }
                } else if (player.giftSkill === '守护') {
                    const validTargets = getAlivePlayers();
                    const hint = `可选: ${validTargets.map(p => p.id).join(',')} (0=本夜不使用,保留技能)`;
                    const target = await getInput(`<${player.id}${player.role}(幸运儿)>守护:`, hint, validTargets.map(p => p.id).concat([0]));
                    if (target > 0) {
                        const realTarget = applyMagicianSwap(target);
                        log(`<${player.id}${player.role}(幸运儿)>守护:${target}`, 'input');
                        game.giftProtected = realTarget;
                        player.giftSkillUsed = true; // 只有使用了才标记为已用
                    } else {
                        log(`<${player.id}${player.role}(幸运儿)>守护:保留技能`, 'system');
                    }
                }
            }
        }

            game.nightSaved = false;
            game.nightProtected = -1;

            game.exploded = false;
            game.bloodMoonSeal = false;
            game.nightmare.skillBlocked = [];

            game.players.forEach(p => {
                p.silenced = false;
                p.cursed = false;
                p.feared = false;
            });

            log(`════════ 第${game.day}夜 ════════`, 'night');
            hideExplodeButtons();
            hideDaySkillButtons();

            if (game.day === 1) {
                // 千面人选择身份（首夜最先）
                await thiefAction();

                await admirerAction();

                await awakenAdmirerAction();
                
                // 丘比特连接情侣

        async function magicianAction() {
            const magician = findPlayerByRole('魔术师');

            game.magician = game.magician || { swappedIds: [], swapMap: {} };
            
            const validTargets = getAlivePlayers().filter(p => !game.magician.swappedIds.includes(p.id));
            if (validTargets.length < 2) {
                log(`<${magician.id}魔术师>无足够可交换目标`, 'system');
                return;
            }
            
            const hint = `选择第一个交换目标: ${validTargets.map(p => p.id).join(',')} (0=不交换)`;
            const t1 = await getInput(`<${magician.id}魔术师>交换1:`, hint, validTargets.map(p => p.id).concat([0]));
            if (t1 === 0) {
                log(`<${magician.id}魔术师>交换:不交换`, 'input');
                return;
            }
            
            const remaining = validTargets.filter(p => p.id !== t1);
            const hint2 = `选择第二个交换目标: ${remaining.map(p => p.id).join(',')}`;
            const t2 = await getInput(`<${magician.id}魔术师>交换2:`, hint2, remaining.map(p => p.id));
            log(`<${magician.id}魔术师>交换:${t1}↔${t2}`, 'input');
            
            game.magician.swappedIds.push(t1, t2);
            // 真正交换两人的号码牌（当晚有效）
            game.magician.swapMap[t1] = t2;
            game.magician.swapMap[t2] = t1;
            game.magician.currentSwap = [t1, t2];
        }

        async function witchAction() {
            const witch = findPlayerByRole('女巫');
            if (!witch || isSkillBlocked(witch)) return;
            
            // 救人
            if (game.witch.hasAntidote && game.nightKillTarget > 0) {
                const canSave = game.nightKillTarget !== witch.id; // 女巫不能自救
                if (canSave) {
                    const hint = `输入${game.nightKillTarget}救人, 0=不救`;
                    const saveTarget = await getInput(`<${witch.id}女巫>刀口${game.nightKillTarget} 救:`, hint, [0, game.nightKillTarget]);
                    log(`<${witch.id}女巫>刀口${game.nightKillTarget} 救:${saveTarget}`, 'input');
                    if (saveTarget === game.nightKillTarget) {
                        game.nightSaved = true;
                        game.witch.hasAntidote = false;
                        game.witch.usedToday = true;
                    }
                } else {
                    log(`<${witch.id}女巫>刀口${game.nightKillTarget} (女巫不可自救)`, 'system');
                }
            }

            // 毒人
            if (game.witch.hasPoison && !game.witch.usedToday) {
                const validTargets = getAlivePlayers().filter(p => p.id !== witch.id);
                const hint = `可选: ${validTargets.map(p => p.id).join(',')} (0=不毒)`;
                const poisonTarget = await getInput(`<${witch.id}女巫>毒:`, hint, validTargets.map(p => p.id).concat([0]));
                log(`<${witch.id}女巫>毒:${poisonTarget}`, 'input');
                if (poisonTarget > 0) {
                    // 应用魔术师交换
                    const realPoisonTarget = applyMagicianSwap(poisonTarget);
                    const poisonedPlayer = findPlayerById(realPoisonTarget);
                    if (poisonedPlayer) {
                        // 恶灵骑士反伤：女巫毒恶灵骑士，次日女巫出局
                        if (poisonedPlayer.role === '恶灵骑士') {
                            game.evilKnight = game.evilKnight || { counterUsed: false };
                            if (!game.evilKnight.counterUsed) {
                                game.nightDeaths.push({ id: witch.id, cause: 'evilKnightCounter' });
                                log(`恶灵骑士反伤触发！女巫将出局`, 'wolf');
                                game.evilKnight.counterUsed = true;
                            }
                        }
                        // 检查是否是老流氓
                        else if (poisonedPlayer.role === '老流氓') {
                            poisonedPlayer.delayedDeath = true;
                            game.rogue.delayedDeath.push({ id: poisonTarget, day: game.day + 1 });
                            log(`老流氓被毒，延迟一天死亡`, 'skill');
                        } else {
                            poisonedPlayer.poisoned = true;
                            game.nightDeaths.push({ id: poisonTarget, cause: 'poison' });
                        }
                        
                        // 女巫计分：毒狼人+1(上限+1)，毒好人-1
                        if (ROLES[poisonedPlayer.role]?.team === 'wolf') {
                            if (!game.witch.poisonWolfScored) {
                                addScore(witch.id, 'behaviorScore', 1, '毒狼人');
                                game.witch.poisonWolfScored = true;
                            }
                        } else if (ROLES[poisonedPlayer.role]?.team === 'good') {
                            addScore(witch.id, 'behaviorScore', -1, '毒好人');
                        }
                    }
                    game.witch.hasPoison = false;
                }
            } else if (!game.witch.hasPoison || game.witch.usedToday) {
                let reason = '';
                if (!game.witch.hasPoison) reason = '无毒药';
                if (game.witch.usedToday) reason = '每夜至多使用一瓶药';
                if (reason) log(`<${witch.id}女巫>毒:(${reason})`, 'system');
            }
        }

        async function awakenHunterSkill(hunter) {
            const hint = `选择巡猎方向: 1=正序 2=逆序`;
            const dir = await getInput(`<${hunter.id}觉醒猎人>巡猎方向:`, hint, [1, 2]);
            log(`<${hunter.id}觉醒猎人>巡猎:${dir === 1 ? '正序' : '逆序'}`, 'input');
            const alivePlayers = getAlivePlayers();
            const hunterIndex = alivePlayers.findIndex(p => p.id === hunter.id);
            let found = null;
            if (dir === 1) {
                for (let i = hunterIndex + 1; i < alivePlayers.length; i++) {
                    if (ROLES[alivePlayers[i].role]?.team === 'wolf') { found = alivePlayers[i]; break; }
                }
                if (!found) {
                    for (let i = 0; i < hunterIndex; i++) {
                        if (ROLES[alivePlayers[i].role]?.team === 'wolf') { found = alivePlayers[i]; break; }
                    }
                }
            } else {
                for (let i = hunterIndex - 1; i >= 0; i--) {
                    if (ROLES[alivePlayers[i].role]?.team === 'wolf') { found = alivePlayers[i]; break; }
                }
                if (!found) {
                    for (let i = alivePlayers.length - 1; i > hunterIndex; i--) {
                        if (ROLES[alivePlayers[i].role]?.team === 'wolf') { found = alivePlayers[i]; break; }
                    }
                }
            }
            if (found) {
                found.alive = false;
                log(`觉醒猎人巡猎命中${found.id}${found.role}`, 'good');
            } else {
                log(`觉醒猎人未找到狼人`, 'system');
            }
        }

        function processNightDeaths() {
            // 处理夜仆死亡
            if (game.noble.servant > 0) {
                const servant = findPlayerById(game.noble.servant);
                if (servant && servant.alive && servant.isServant) {
                    game.nightDeaths.push({ id: game.noble.servant, cause: 'servant' });
                    servant.isServant = false;
                    game.noble.servant = -1;
                }
            }
            
            // 流光伯爵保护
            const countProtected = game.count?.protectedTarget || -1;
            // 觉醒守卫保护
            const awakenGuardProtected = game.awakenGuard?.protectedTarget || -1;
            // 觉醒愚者保护
            const awakenFoolProtected = game.awakenFool?.protectTarget || -1;
            // 幸运儿守护（奇迹商人赠送）
            const giftProtected = game.giftProtected || -1;
            
            // 狼刀目标
            if (game.nightKillTarget > 0) {
                const targetPlayer = findPlayerById(game.nightKillTarget);
                if (targetPlayer) {
                    const isProtected = game.nightProtected === game.nightKillTarget;
                    const isDreamProtected = game.nightDreamProtected === game.nightKillTarget;
                    const isCountProtected = countProtected === game.nightKillTarget;
                    const isAwakenGuardProtected = awakenGuardProtected === game.nightKillTarget;
                    const isAwakenFoolProtected = awakenFoolProtected === game.nightKillTarget;
                    const isGiftProtected = giftProtected === game.nightKillTarget;
                    
                    // 恶灵骑士免疫狼刀
                    if (targetPlayer.role === '恶灵骑士') {
                        log(`恶灵骑士免疫狼刀`, 'skill');
                    }
                    // 咒狐免疫狼刀
                    else if (targetPlayer.role === '咒狐') {
                        log(`咒狐免疫狼刀`, 'skill');
                    }
                    // 觉醒守卫保护（完全免疫）
                    else if (isAwakenGuardProtected) {
                        log(`觉醒守卫保护生效，${targetPlayer.id}免疫伤害`, 'skill');
                    }
                    // 觉醒愚者秘密之身保护
                    else if (isAwakenFoolProtected) {
                        log(`觉醒愚者秘密之身保护生效`, 'skill');
                        game.awakenFool.secretUsed = true;
                    }
                    // 流光伯爵保护
                    else if (isCountProtected) {
                        log(`流光伯爵庇护生效，${targetPlayer.id}免疫伤害`, 'skill');
                    }
                    // 同守同救规则
                    else if (isProtected && game.nightSaved) {
                        game.nightDeaths.push({ id: game.nightKillTarget, cause: 'knife', note: '同守同救' });
                    } 
                    // 正常保护检查
                    else if (!isProtected && !isDreamProtected && !game.nightSaved) {
                        game.nightDeaths.push({ id: game.nightKillTarget, cause: 'knife' });
                    } else {
                        // 被守卫或摄梦人或女巫救了
                        if (isProtected) log(`守卫守护生效`, 'skill');
                        if (isDreamProtected) log(`摄梦人梦游保护生效`, 'skill');
                        if (game.nightSaved) log(`女巫解药生效`, 'skill');
                    }
                }
            }
            
            // 重置保护状态
            if (game.count) game.count.protectedTarget = -1;
            if (game.awakenGuard) game.awakenGuard.protectedTarget = -1;
            if (game.awakenFool) game.awakenFool.protectTarget = -1;

            startDay();
        }

        // ==================== 白天阶段 ====================
        async function startDay() {
            game.phase = 'day';
            log(`════════ 第${game.day}天 ════════`, 'day');

            // 熊咆哮检测
            await bearCheck();

            // 处理死亡
            const deathDetails = [];
            const uniqueDeaths = [];
            const seenIds = new Set();
            
            // 按号码排序
            game.nightDeaths.sort((a, b) => a.id - b.id);
            
            for (const death of game.nightDeaths) {
                if (!seenIds.has(death.id)) {
                    seenIds.add(death.id);
                    uniqueDeaths.push(death);
                }
            }

            for (const death of uniqueDeaths) {
                const player = findPlayerById(death.id);
                if (player && player.alive) {
                    player.alive = false;
                    let detail = `${player.id}${player.role}`;
                    if (death.note) detail += `(${death.note})`;
                    deathDetails.push(detail);

                    // 处理殉情
                    await processCharmDeath(player, deathDetails);
                }
            }

            if (deathDetails.length > 0) {
                log(`第${game.day}夜死亡角色:${deathDetails.join(' ')}`, 'death');
            } else {
                log(`第${game.day}夜死亡角色:平安夜`, 'system');
            }

            // 显示存活角色
            logAlive();

            if (checkGameEnd()) return;

            // 猎人技能（夜晚死亡且非被毒）
            for (const death of uniqueDeaths) {
                const player = findPlayerById(death.id);
                if (player && player.role === '猎人' && death.cause !== 'poison') {
                    await hunterShoot(player);
                    if (checkGameEnd()) return;
                }
                // 狼王/觉醒狼王夜晚死亡也能带人（非被毒）
                if (player && (player.role === '狼王' || player.role === '觉醒狼王' || player.hasWolfClaw) && death.cause !== 'poison') {
                    await wolfKingSkill(player);
                    if (checkGameEnd()) return;
                }
                // 觉醒猎人夜晚死亡触发巡猎
                if (player && player.role === '觉醒猎人') {
                    await awakenHunterSkill(player);
                    if (checkGameEnd()) return;
                }
            }

            // 警长竞选
            if (game.config.policeRule !== 'none' && game.day === 1) {
                const result = await policeCampaign();
                if (result === 'exploded') {
                    startNight();
                    return;
                }
            }

            // 显示白天技能按钮和自爆按钮
            showDaySkillButtons();
            showExplodeButtons();

            // 投票环节
            await votingPhase();
        }

        async function bearCheck() {
            const bear = findPlayerByRole('熊');
            if (!bear) return;
            
            // 获取熊的相邻存活玩家
            const alivePlayers = getAlivePlayers();
            const bearIndex = alivePlayers.findIndex(p => p.id === bear.id);
            if (bearIndex === -1) return;
            
            const prevIndex = (bearIndex - 1 + alivePlayers.length) % alivePlayers.length;
            const nextIndex = (bearIndex + 1) % alivePlayers.length;
            const neighbors = [alivePlayers[prevIndex], alivePlayers[nextIndex]];
            
            const hasWolf = neighbors.some(p => ROLES[p.role]?.team === 'wolf');
            if (hasWolf) {
                log(`🐻 熊咆哮了！`, 'skill');
            } else {
                log(`🐻 熊没有咆哮`, 'system');
            }
        }

        async function processCharmDeath(player, deathDetails) {
            // 狼美人死亡，被魅惑者殉情（单向连接：狼美人死→魅惑对象死，反过来不成立）
            if (player.role === '狼美人') {
                // 只有昨晚被魅惑的玩家殉情
                const lastCharmed = game.wolfBeauty.lastCharmed;
                if (lastCharmed > 0) {
                    const cp = findPlayerById(lastCharmed);
                    if (cp && cp.alive && cp.charmed) {
                        cp.alive = false;
                        deathDetails.push(`${cp.id}${cp.role}(殉情)`);
                    }
                }
            }
            
            // 注意：被魅惑者死亡，狼美人不会死（单向连接）
            // 已删除原有的反向殉情逻辑

            // 摄梦人死亡，当晚梦游者也出局
            if (player.role === '摄梦人' && game.phase === 'night') {
                const dreamTarget = game.nightDreamProtected;
                if (dreamTarget > 0) {
                    const dreamer = findPlayerById(dreamTarget);
                    if (dreamer && dreamer.alive) {
                        dreamer.alive = false;
                        deathDetails.push(`${dreamer.id}${dreamer.role}(摄梦人死亡连带)`);
                    }
                }
            }

            // 情侣殉情
            if (game.lovers && game.lovers.includes(player.id)) {
                const otherId = game.lovers.find(id => id !== player.id);
                const other = findPlayerById(otherId);
                if (other && other.alive) {
                    other.alive = false;
                    deathDetails.push(`${other.id}${other.role}(情侣殉情)`);
                }
            }

            // 野孩子榜样死亡变狼
            if (game.wildChild.idol === player.id) {
                const wildChild = findPlayerByRole('野孩子');
                if (wildChild && wildChild.alive) {
                    // 野孩子变成狼人
                    wildChild.role = '狼人';
                    game.wildChild.transformed = true;
                    log(`野孩子的榜样出局，野孩子变为狼人！`, 'wolf');
                }
            }
            
            // 觉醒暗恋者的偶像出局处理
            if (game.awakenAdmirer && game.awakenAdmirer.idol === player.id) {
                const admirer = findPlayerByRole('觉醒暗恋者');
                if (admirer && admirer.alive) {
                    // 检查出局原因：被放逐则变狼，其他原因则继承身份
                    if (game.phase === 'day' && game.lastExiled === player.id) {
                        admirer.role = '狼人';
                        log(`觉醒暗恋者的偶像被放逐，觉醒暗恋者变为狼人！`, 'wolf');
                    } else {
                        log(`觉醒暗恋者继承偶像${player.role}的身份！`, 'skill');
                        // 继承身份的复杂逻辑简化处理
                    }
                }
            }
        }

        async function hunterShoot(hunter) {
            if (hunter.poisoned) {
                log(`<${hunter.id}猎人>被毒无法开枪`, 'system');
                return;
            }
            
            const validTargets = getAlivePlayers();
            if (validTargets.length > 0) {
                const hint = `可选: ${validTargets.map(p => p.id).join(',')} (0=不开枪)`;
                const shootTarget = await getInput(`<${hunter.id}猎人>开枪:`, hint, validTargets.map(p => p.id).concat([0]));
                log(`<${hunter.id}猎人>开枪:${shootTarget}`, 'input');
                if (shootTarget > 0) {
                    const shotPlayer = findPlayerById(shootTarget);
                    if (shotPlayer) {
                        // 猎人计分：捕猎狼人+1，捕猎好人-1
                        if (ROLES[shotPlayer.role]?.team === 'wolf') {
                            addScore(hunter.id, 'behaviorScore', 1, '捕猎狼人');
                        } else if (ROLES[shotPlayer.role]?.team === 'good') {
                            addScore(hunter.id, 'behaviorScore', -1, '捕猎好人');
                        }
                        
                        // 老流氓被射杀延迟死亡
                        if (shotPlayer.role === '老流氓') {
                            shotPlayer.delayedDeath = true;
                            game.rogue.delayedDeath.push({ id: shootTarget, day: game.day + 1 });
                            log(`老流氓被射杀，延迟一天死亡`, 'skill');
                        } else {
                            shotPlayer.alive = false;
                            log(`${shotPlayer.id}${shotPlayer.role} 被猎人带走`, 'death');
                            // 猎人带走的人如果是狼王/猎人，触发连锁
                            if (shotPlayer.role === '狼王' || shotPlayer.hasWolfClaw) {
                                await wolfKingSkill(shotPlayer);
                            }
                            if (shotPlayer.role === '猎人' && !shotPlayer.poisoned) {
                                await hunterShoot(shotPlayer);
                            }
                        }
                        logAlive();
                    }
                }
            }
        }

        // ==================== 警长竞选 ====================
        async function policeCampaign() {
            log(`【警长竞选】`, 'police');
            
            const alivePlayers = getAlivePlayers();
            const hint = `输入上警玩家号码(逗号分隔), 0=无人上警`;
            const candidatesInput = await getInput(`<上警>请输入参选玩家:`, hint, null, true);
            
            if (candidatesInput === '0' || !candidatesInput.trim()) {
                log(`无人上警，本局无警长`, 'police');
                return 'no_sheriff';
            }

            const candidateIds = candidatesInput.split(/[,，]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
            game.sheriffCandidates = candidateIds.filter(id => findPlayerById(id)?.alive);
            
            if (game.sheriffCandidates.length === 0) {
                log(`无有效候选人，本局无警长`, 'police');
                return 'no_sheriff';
            }

            log(`上警玩家: ${game.sheriffCandidates.join(',')}`, 'police');

            // 发言阶段可能有狼人自爆
            showExplodeButtons();
            const explodeResult = await checkExplodeDuringPolice('发言');
            if (explodeResult) return 'exploded';

            // 退水环节
            const withdrawInput = await getInput(`<退水>输入退水玩家(逗号分隔,0=无):`, `当前候选: ${game.sheriffCandidates.join(',')}`, null, true);
            if (withdrawInput && withdrawInput !== '0') {
                const withdrawIds = withdrawInput.split(/[,，]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                game.sheriffCandidates = game.sheriffCandidates.filter(id => !withdrawIds.includes(id));
                log(`退水后候选人: ${game.sheriffCandidates.length > 0 ? game.sheriffCandidates.join(',') : '无'}`, 'police');
            }

            if (game.sheriffCandidates.length === 0) {
                log(`所有候选人退水，警徽流失`, 'police');
                return 'no_sheriff';
            }

            if (game.sheriffCandidates.length === 1) {
                game.sheriff = game.sheriffCandidates[0];
                const sheriffPlayer = findPlayerById(game.sheriff);
                log(`${game.sheriff}${sheriffPlayer.role} 自动当选警长`, 'police');
                return 'elected';
            }

            // 投票环节
            const hint2 = `候选人: ${game.sheriffCandidates.join(',')} (0=平票/流失)`;
            const sheriffVote = await getInput(`<警长投票>:`, hint2, game.sheriffCandidates.concat([0]));
            
            if (sheriffVote === 0) {
                log(`警长投票平票，警徽流失`, 'police');
                return 'no_sheriff';
            }

            game.sheriff = sheriffVote;
            const sheriffPlayer = findPlayerById(game.sheriff);
            log(`${game.sheriff}${sheriffPlayer.role} 当选警长`, 'police');
            return 'elected';
        }

        async function checkExplodeDuringPolice(phase) {
            const explodableWolves = getExplodableWolves();
            if (explodableWolves.length === 0) return false;

            const hint = `可自爆狼人: ${explodableWolves.map(w => w.id).join(',')} (0=不自爆)`;
            const explodeChoice = await getInput(`<${phase}阶段>是否有狼人自爆:`, hint, explodableWolves.map(w => w.id).concat([0]));
            
            if (explodeChoice > 0) {
                return await handleWolfExplode(explodeChoice, 'police');
            }
            return false;
        }

            // 定序王子
            const prince = findPlayerByRole('定序王子');
            if (prince && !game.prince.used) {
                hasSkills = true;
                const btn = document.createElement('button');
                btn.className = 'action-btn bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded';
                btn.textContent = `👑 ${prince.id}定序王子 重置投票(投票后可用)`;
                btn.onclick = () => { /* 在投票时处理 */ };
                buttons.appendChild(btn);
            }
            
            // 觉醒白狼王
            const awwk = findPlayerByRole('觉醒白狼王');
            game.awakenWhiteWolf = game.awakenWhiteWolf || { used: false };
            if (awwk && !game.awakenWhiteWolf.used) {
                hasSkills = true;
                const btn = document.createElement('button');
                btn.className = 'action-btn bg-red-600 hover:bg-red-700 px-4 py-2 rounded';
                btn.textContent = `🎭 ${awwk.id}觉醒白狼王 诱导自曝`;
                btn.onclick = async () => {
                    hideDaySkillButtons();
                    hideExplodeButtons();
                    const result = await awakenWhiteWolfKingAction();
                    if (result) {
                        logAlive();
                        if (!checkGameEnd()) startNight();
                    } else {
                        showDaySkillButtons();
                        showExplodeButtons();
                    }
                };
                buttons.appendChild(btn);
            }
            
            if (hasSkills) {
                area.classList.remove('hidden');
            } else {
                area.classList.add('hidden');
            }
        }

        function hideDaySkillButtons() {
            document.getElementById('daySkillArea').classList.add('hidden');
        }

        async function knightDuel(knight) {
            hideDaySkillButtons();
            hideExplodeButtons();
            
            const validTargets = getAlivePlayers().filter(p => p.id !== knight.id);
            const hint = `选择决斗对象: ${validTargets.map(p => p.id).join(',')}`;
            const duelTarget = await getInput(`<${knight.id}骑士>决斗:`, hint, validTargets.map(p => p.id));
            log(`<${knight.id}骑士>决斗:${duelTarget}`, 'input');
            
            game.knight.used = true;
            const targetPlayer = findPlayerById(duelTarget);
            
            if (targetPlayer) {
                if (ROLES[targetPlayer.role]?.team === 'wolf') {
                    targetPlayer.alive = false;
                    log(`${duelTarget}${targetPlayer.role} 是狼人，被骑士斩杀！`, 'good');
                    logAlive();
                    if (checkGameEnd()) return;
                    log(`决斗成功，直接进入黑夜`, 'system');
                    startNight();
                } else {
                    knight.alive = false;
                    log(`${duelTarget}${targetPlayer.role} 不是狼人，骑士牺牲！`, 'death');
                    logAlive();
                    if (checkGameEnd()) return;
                    showDaySkillButtons();
                    showExplodeButtons();
                }
            }
        }

        // ==================== 狼人自爆 ====================
        function showExplodeButtons() {
            const wolves = getExplodableWolves();
            if (wolves.length === 0 || game.gameOver) {
                hideExplodeButtons();
                return;
            }

            const area = document.getElementById('explodeArea');
            const buttons = document.getElementById('explodeButtons');
            buttons.innerHTML = '';

            wolves.forEach(wolf => {
                const btn = document.createElement('button');
                btn.className = 'action-btn bg-red-600 hover:bg-red-700 px-4 py-2 rounded';
                btn.textContent = `💥 ${wolf.id}${wolf.role} 自爆`;
                btn.onclick = () => triggerExplode(wolf.id);
                buttons.appendChild(btn);
            });

            area.classList.remove('hidden');
        }

        function hideExplodeButtons() {
            document.getElementById('explodeArea').classList.add('hidden');
        }

        async function triggerExplode(wolfId) {
            if (game.exploded || game.gameOver) return;
            game.exploded = true;
            hideExplodeButtons();
            hideDaySkillButtons();
            hideInput();
            
            await handleWolfExplode(wolfId, 'day');
        }

        async function handleWolfExplode(wolfId, context) {
            const wolf = findPlayerById(wolfId);
            if (!wolf || !wolf.alive) return false;

            wolf.alive = false;
            log(`【自爆】${wolf.id}${wolf.role} 自爆身份！`, 'wolf');

            // 白狼王自爆可带人
            if (wolf.role === '白狼王') {
                const validTargets = getAlivePlayers();
                if (validTargets.length > 0) {
                    const hint = `可选: ${validTargets.map(p => p.id).join(',')} (0=不带人)`;
                    const target = await getInput(`<${wolf.id}白狼王>自爆带人:`, hint, validTargets.map(p => p.id).concat([0]));
                    log(`<${wolf.id}白狼王>自爆带人:${target}`, 'input');
                    if (target > 0) {
                        const targetPlayer = findPlayerById(target);
                        if (targetPlayer) {
                            targetPlayer.alive = false;
                            log(`${targetPlayer.id}${targetPlayer.role} 被白狼王带走`, 'death');
                        }
                    }
                }
            }

            // 血月使徒自爆封印技能
            if (wolf.role === '血月使徒') {
                log(`血月使徒自爆，当晚好人技能被封印！`, 'wolf');
                game.bloodMoonSeal = true;
            }

            // 处理殉情
            const deathDetails = [];
            await processCharmDeath(wolf, deathDetails);
            if (deathDetails.length > 0) {
                log(`连带死亡: ${deathDetails.join(' ')}`, 'death');
            }

            logAlive();

            if (context === 'police') {
                log(`警徽流失！`, 'police');
            }

            if (checkGameEnd()) return true;

            // 自爆后直接进入黑夜
            if (context === 'day' || context === 'police') {
                log(`自爆后直接进入黑夜`, 'system');
                setTimeout(() => startNight(), 500);
            }

            return true;
        }

        // ==================== 投票环节 ====================
        async function votingPhase() {
            if (game.exploded || game.gameOver) return;
            
            // 检查绑票
            checkTieVote();

            const alivePlayers = getAlivePlayers();
            const playerList = alivePlayers.map(p => {
                let suffix = '';
                if (p.id === game.sheriff) suffix += '👑';
                if (p.cursed) suffix += '🪶';
                if (p.silenced) suffix += '🔇';
                return `${p.id}${p.role}${suffix}`;
            }).join(' ');
            
            let voteResult;
            let individualVotes = {}; // 记录每个人的投票
            
            // 详细投票模式（含投票分）
            if (scoring.enabled && scoring.withVote) {
                voteResult = await detailedVoting(alivePlayers);
                if (voteResult === -1) {
                    const wolves = getExplodableWolves();
                    if (wolves.length > 0) {
                        const wolfHint = `选择自爆的狼人: ${wolves.map(w => w.id).join(',')}`;
                        const wolfChoice = await getInput(`<自爆>选择狼人:`, wolfHint, wolves.map(w => w.id));
                        await handleWolfExplode(wolfChoice, 'day');
                        return;
                    }
                }
            } else {
                const hint = `可选: ${alivePlayers.map(p => p.id).join(',')} (0=弃票/平票, -1=自爆)`;
                voteResult = await getInput(`<全体 ${playerList}>投票:`, hint, alivePlayers.map(p => p.id).concat([0, -1]));
            }
            
            if (voteResult === -1) {
                const wolves = getExplodableWolves();
                if (wolves.length > 0) {
                    const wolfHint = `选择自爆的狼人: ${wolves.map(w => w.id).join(',')}`;
                    const wolfChoice = await getInput(`<自爆>选择狼人:`, wolfHint, wolves.map(w => w.id));
                    await handleWolfExplode(wolfChoice, 'day');
                    return;
                }
            }

            const voteTarget = voteResult;
            log(`<全体>投票:${voteTarget}`, 'input');
            hideExplodeButtons();
            hideDaySkillButtons();

            game.currentVoteTarget = voteTarget;

            if (voteTarget > 0) {
                const votedPlayer = findPlayerById(voteTarget);
                
                // 白猫被投票 - 可以额外存活至下次投票后
                if (votedPlayer.role === '白猫' && !game.whiteCat.extraLifeUsed) {
                    game.whiteCat.extraLifeUsed = true;
                    game.whiteCat.extraLifeActive = true;
                    log(`🐱 ${votedPlayer.id}白猫 翻牌发动技能，额外存活至下次投票后`, 'skill');
                    logAlive();
                    if (!checkGameEnd()) startNight();
                    return;
                }
                
                // 检查白猫额外存活结束
                if (game.whiteCat.extraLifeActive) {
                    const whiteCat = findPlayerByRole('白猫');
                    if (whiteCat && whiteCat.alive) {
                        whiteCat.alive = false;
                        game.whiteCat.extraLifeActive = false;
                        log(`🐱 ${whiteCat.id}白猫 额外存活结束，出局`, 'death');
                    }
                }
                if (votedPlayer) {
                    // 定序王子可重置投票
                    const prince = findPlayerByRole('定序王子');
                    if (prince && !game.prince.used) {
                        const resetChoice = await getInput(`<${prince.id}定序王子>是否重置投票? (1=是, 0=否):`, '', [0, 1]);
                        if (resetChoice === 1) {
                            game.prince.used = true;
                            log(`定序王子重置投票！`, 'skill');
                            showDaySkillButtons();
                            showExplodeButtons();
                            await votingPhase();
                            return;
                        }
                    }
                    
                    // 白痴被投票
                    if (votedPlayer.role === '白痴' && !votedPlayer.idiotRevealed) {
                        const revealChoice = await getInput(`<${votedPlayer.id}白痴>是否翻牌免死? (1=是, 0=否):`, '', [0, 1]);
                        if (revealChoice === 1) {
                            votedPlayer.idiotRevealed = true;
                            log(`${votedPlayer.id}白痴 翻牌免死，失去投票权`, 'good');
                            logAlive();
                            if (!checkGameEnd()) startNight();
                            return;
                        }
                    }
                    
                    // 觉醒狼美人被投票 - 首次出局由被魅惑者替代
                    if (votedPlayer.role === '觉醒狼美人') {
                        game.awakenBeauty = game.awakenBeauty || { shieldUsed: false, charmedTarget: -1 };
                        if (!game.awakenBeauty.shieldUsed && game.awakenBeauty.charmedTarget > 0) {
                            const charmedPlayer = findPlayerById(game.awakenBeauty.charmedTarget);
                            if (charmedPlayer && charmedPlayer.alive) {
                                game.awakenBeauty.shieldUsed = true;
                                log(`觉醒狼美人发动挽歌幻象！${charmedPlayer.id}${charmedPlayer.role}替代出局`, 'wolf');
                                charmedPlayer.alive = false;
                                log(`第${game.day}天死亡角色:${charmedPlayer.id}${charmedPlayer.role}(替代觉醒狼美人)`, 'death');
                                logAlive();
                                if (!checkGameEnd()) startNight();
                                return;
                            }
                        }
                    }
                    
                    // 炸弹人被投票
                    if (votedPlayer.role === '炸弹人') {
                        log(`💣 炸弹人被放逐，所有投票者将被炸死！`, 'death');
                        const votersInput = await getInput(`输入投给炸弹人的玩家号码(逗号分隔):`, '', null, true);
                        if (votersInput) {
                            const voterIds = votersInput.split(/[,，]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                            for (const vid of voterIds) {
                                const voter = findPlayerById(vid);
                                if (voter && voter.alive && voter.id !== votedPlayer.id) {
                                    voter.alive = false;
                                    log(`${voter.id}${voter.role} 被炸弹人炸死`, 'death');
                                }
                            }
                        }
                    }
                    
                    // 河豚被投票
                    if (votedPlayer.role === '河豚' && !game.pufferfish.used) {
                        const pufferfishChoice = await getInput(`<${votedPlayer.id}河豚>是否翻牌带走投票者? (1=是, 0=否):`, '', [0, 1]);
                        if (pufferfishChoice === 1) {
                            game.pufferfish.used = true;
                            log(`河豚翻牌！所有投票者将被带走`, 'skill');
                            // 简化处理：询问投票者
                            const votersInput = await getInput(`输入投给河豚的玩家号码(逗号分隔):`, '', null, true);
                            if (votersInput) {
                                const voterIds = votersInput.split(/[,，]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                                for (const vid of voterIds) {
                                    const voter = findPlayerById(vid);
                                    if (voter && voter.alive) {
                                        voter.alive = false;
                                        log(`${voter.id}${voter.role} 被河豚带走`, 'death');
                                    }
                                }
                            }
                        }
                    }

                    votedPlayer.alive = false;
                    game.lastExiled = voteTarget;
                    log(`第${game.day}天死亡角色:${votedPlayer.id}${votedPlayer.role}`, 'death');

                    // 野孩子榜样被放逐
                    if (game.wildChild.idol === voteTarget) {
                        const wildChild = findPlayerByRole('野孩子');
                        if (wildChild && wildChild.alive) {
                            log(`野孩子的榜样被放逐，野孩子变为狼人阵营！`, 'wolf');
                        }
                    }

                    // 狼王/猎人技能
                    if (votedPlayer.role === '狼王' || votedPlayer.role === '觉醒狼王' || votedPlayer.hasWolfClaw) {
                        await wolfKingSkill(votedPlayer);
                    }
                    
                    if (votedPlayer.role === '猎人' && !votedPlayer.poisoned) {
                        await hunterShoot(votedPlayer);
                    }
                    
                    // 觉醒猎人巡猎
                    if (votedPlayer.role === '觉醒猎人') {
                        await awakenHunterSkill(votedPlayer);
                    }

                    // 处理殉情
                    const deathDetails = [];
                    await processCharmDeath(votedPlayer, deathDetails);
                    if (deathDetails.length > 0) {
                        log(`连带死亡: ${deathDetails.join(' ')}`, 'death');
                    }
                }
            } else {
                log(`第${game.day}天死亡角色:无(弃票/平票)`, 'system');
            }

            // 处理老流氓延迟死亡
            const rogueDeaths = game.rogue.delayedDeath.filter(d => d.day === game.day);
            for (const rd of rogueDeaths) {
                const rogue = findPlayerById(rd.id);
                if (rogue && rogue.alive) {
                    rogue.alive = false;
                    log(`${rogue.id}老流氓 延迟死亡生效`, 'death');
                }
            }
            game.rogue.delayedDeath = game.rogue.delayedDeath.filter(d => d.day !== game.day);

            logAlive();
            if (checkGameEnd()) return;
            startNight();
        }

        async function wolfKingSkill(player) {
            const clawCount = player.role === '觉醒狼王' ? game.awakenWolfKing.claws : 1;
            
            for (let i = 0; i < clawCount; i++) {
                const validTargets = getAlivePlayers();
                if (validTargets.length > 0) {
                    const hint = `可选: ${validTargets.map(p => p.id).join(',')} (0=不带人)`;
                    const label = clawCount > 1 ? `带人${i+1}` : `带人`;
                    const shootTarget = await getInput(`<${player.id}${player.role}>${label}:`, hint, validTargets.map(p => p.id).concat([0]));
                    log(`<${player.id}${player.role}>${label}:${shootTarget}`, 'input');
                    if (shootTarget > 0) {
                        const shotPlayer = findPlayerById(shootTarget);
                        if (shotPlayer) {
                            shotPlayer.alive = false;
                            log(`${shotPlayer.id}${shotPlayer.role} 被狼王带走`, 'death');
                        }
                    }
                }
            }
        }

        // ==================== 胜负判定 ====================
        function checkGameEnd() {
            const aliveWolves = getAliveWolves();
            const aliveGood = getAliveGoodPlayers();
            const aliveGods = getAliveGods();
            const aliveVillagers = getAliveVillagers();

            // 吹笛者胜利已在其行动中检查

            // 咒狐检查
            const fox = findPlayerByRole('咒狐');

            // 好人胜利：狼人全灭
            if (aliveWolves.length === 0) {
                if (fox && fox.alive) {
                    log('🦊 咒狐存活，咒狐单独获胜！', 'third');
                    calculateFinalScores(null);
                } else {
                    log('🎉 游戏结束，好人阵营获胜！', 'good');
                    calculateFinalScores('good');
                }
                game.gameOver = true;
                hideInput();
                hideExplodeButtons();
                hideDaySkillButtons();
                if (scoring.enabled) showScorePanel();
                return true;
            }

            // 狼人胜利条件检查
            for (const condition of game.config.winner) {
                let wolfWin = false;
                let winReason = '';
                
                if (condition === 'number' && aliveWolves.length >= aliveGood.length) {
                    wolfWin = true;
                    winReason = '数量压制';
                }
                if (condition === 'edge' && (aliveGods.length === 0 || aliveVillagers.length === 0)) {
                    wolfWin = true;
                    winReason = '屠边';
                }
                if (condition === 'city' && aliveGood.length === 0) {
                    wolfWin = true;
                    winReason = '屠城';
                }
                
                if (wolfWin) {
                    if (fox && fox.alive) {
                        log('🦊 咒狐存活，咒狐单独获胜！', 'third');
                        calculateFinalScores(null);
                    } else {
                        log(`🐺 游戏结束，狼人阵营${winReason}获胜！`, 'wolf');
                        calculateFinalScores('wolf');
                    }
                    game.gameOver = true;
                    hideInput();
                    hideExplodeButtons();
                    hideDaySkillButtons();
                    if (scoring.enabled) showScorePanel();
                    return true;
                }
            }

            return false;
        }

        function logAlive() {
            const aliveDisplay = getAlivePlayers().map(p => {
                let suffix = '';
                if (p.id === game.sheriff) suffix += '👑';
                if (p.charmed) suffix += '💕';
                if (p.piperCharmed) suffix += '🎵';
                if (p.idiotRevealed) suffix += '🤡';
                if (p.cursed) suffix += '🪶';
                return `${p.id}${p.role}${suffix}`;
            }).join(' ');
            log(`当前存活角色:${aliveDisplay}`, 'system');
        }

        // ==================== 输入处理 ====================
        function getInput(prompt, hint, validOptions, freeInput = false) {
            return new Promise((resolve) => {
                document.getElementById('inputArea').classList.remove('hidden');
                document.getElementById('inputPrompt').textContent = prompt;
                document.getElementById('inputHint').textContent = hint || '';
                document.getElementById('playerInput').value = '';
                document.getElementById('playerInput').focus();
                
                game.inputCallback = (value) => {
                    if (freeInput) {
                        resolve(value);
                        return;
                    }
                    const num = parseInt(value);
                    if (!isNaN(num) && validOptions && validOptions.includes(num)) {
                        resolve(num);
                    } else if (!validOptions) {
                        resolve(value);
                    } else {
                        alert(`无效输入，请输入: ${validOptions.join(', ')}`);
                        document.getElementById('playerInput').value = '';
                        document.getElementById('playerInput').focus();
                    }
                };
            });
        }

        function submitInput() {
            const value = document.getElementById('playerInput').value;
            if (game.inputCallback) {
                game.inputCallback(value);
            }
        }

        function hideInput() {
            document.getElementById('inputArea').classList.add('hidden');
        }

        function resetGame() {
            document.getElementById('configPanel').classList.remove('hidden');
            document.getElementById('gameArea').classList.add('hidden');
            game.gameOver = true;
        }

        function exportLog() {
            const terminal = document.getElementById('terminal');
            const logs = Array.from(terminal.children).map(div => div.textContent).join('\n');
            const blob = new Blob([logs], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `狼人杀记录_${new Date().toLocaleString().replace(/[/:]/g, '-')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 初始化
        initRoleSelector();
        quickConfig('9人标准');
    </script>
</body>
