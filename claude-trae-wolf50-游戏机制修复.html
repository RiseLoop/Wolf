        function hideDaySkillButtons() {
            document.getElementById('daySkillArea').classList.add('hidden');
        }

        async function knightDuel(knight) {
            hideDaySkillButtons();
            hideExplodeButtons();
            
            const validTargets = getAlivePlayers().filter(p => p.id !== knight.id);
            const hint = `选择决斗对象: ${validTargets.map(p => p.id).join(',')}`;
            const duelTarget = await getInput(`<${knight.id}骑士>决斗:`, hint, validTargets.map(p => p.id));
            log(`<${knight.id}骑士>决斗:${duelTarget}`, 'input');
            
            game.knight.used = true;
            const targetPlayer = findPlayerById(duelTarget);
            
            if (targetPlayer) {
                if (ROLES[targetPlayer.role]?.team === 'wolf') {
                    targetPlayer.alive = false;
                    log(`${duelTarget}${targetPlayer.role} 是狼人，被骑士斩杀！`, 'good');
                    // 骑士计分：决斗狼人+1
                    addScore(knight.id, 'behaviorScore', 1, '决斗狼人');
                    // 狼美人计分：被决斗-0.5
                    if (targetPlayer.role === '狼美人') {
                        addScore(targetPlayer.id, 'behaviorScore', -0.5, '被决斗');
                        // 狼美人被决斗，魅惑技能失效
                        game.wolfBeauty = game.wolfBeauty || {};
                        game.wolfBeauty.charmInvalid = true;
                        log(`狼美人被骑士决斗，魅惑技能失效`, 'skill');
                    }
                    logAlive();
                    if (checkGameEnd()) return;
                    log(`决斗成功，直接进入黑夜`, 'system');
                    startNight();
                } else {
                    knight.alive = false;
                    log(`${duelTarget}${targetPlayer.role} 不是狼人，骑士牺牲！`, 'death');
                    // 骑士计分：决斗好人-1
                    addScore(knight.id, 'behaviorScore', -1, '决斗好人');
                    logAlive();
                    if (checkGameEnd()) return;
                    showDaySkillButtons();
                    showExplodeButtons();
                }
            }
        }

        // 侦探技能 - 警下翻牌直接佩带警徽,指定一名玩家死亡
        async function detectiveSkill(detective) {
            hideDaySkillButtons();
            hideExplodeButtons();
            
            // 侦探翻牌直接佩戴警徽
            game.sheriff = detective.id;
            log(`🔍 ${detective.id}侦探 翻牌佩戴警徽！`, 'police');
            
            // 指定一名玩家死亡
            const validTargets = getAlivePlayers().filter(p => p.id !== detective.id);
            const hint = `指定一名玩家死亡: ${validTargets.map(p => p.id).join(',')}`;
            const target = await getInput(`<${detective.id}侦探>斩杀:`, hint, validTargets.map(p => p.id));
            log(`<${detective.id}侦探>斩杀:${target}`, 'input');
            
            game.detective.used = true;
            game.detective.activated = true;
            game.detective.lastTarget = target;
            
            const targetPlayer = findPlayerById(target);
            if (targetPlayer) {
                targetPlayer.alive = false;
                log(`${target}${targetPlayer.role} 被侦探斩杀翻牌出局`, 'death');
                
                // 被斩杀的猎人可以开枪
                if (targetPlayer.role === '猎人' && !targetPlayer.poisoned) {
                    await hunterShoot(targetPlayer);
                }
                
                logAlive();
                if (checkGameEnd()) return;
            }
            
            showDaySkillButtons();
            showExplodeButtons();
        }

        // ==================== 玩家自爆 ====================
        function showExplodeButtons() {
            const wolves = getExplodableWolves();
            const goodExploders = getExplodableGoodPlayers();
            const allExploders = [...wolves, ...goodExploders];
            
            if (allExploders.length === 0 || game.gameOver) {
                hideExplodeButtons();
                return;
            }

            const area = document.getElementById('explodeArea');
            const buttons = document.getElementById('explodeButtons');
            buttons.innerHTML = '';

            allExploders.forEach(player => {
                const btn = document.createElement('button');
                btn.className = 'action-btn bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 px-4 py-3 rounded-xl font-semibold';
                btn.textContent = `💥 ${player.id}${player.role} 自爆`;
                btn.onclick = () => triggerExplode(player.id);
                buttons.appendChild(btn);
            });

            area.classList.remove('hidden');
        }

        function hideExplodeButtons() {
            document.getElementById('explodeArea').classList.add('hidden');
        }

        async function triggerExplode(wolfId) {
            if (game.exploded || game.gameOver) return;
            game.exploded = true;
            hideExplodeButtons();
            hideDaySkillButtons();
            hideInput();
            
            // 判断是否在警长竞选期间
            const context = game.inPoliceCampaign ? 'police' : 'day';
            const result = await handleWolfExplode(wolfId, context);
            
            // 如果在警长竞选期间自爆，需要调用 handlePoliceExplode 处理吞警徽逻辑
            if (context === 'police' && result) {
                const policeResult = await handlePoliceExplode(wolfId);
                // 根据 handlePoliceExplode 的返回值决定后续操作
                if (policeResult === 'exploded_skip_day' || policeResult === 'exploded_first_day' || policeResult === 'exploded_second_day') {
                    startNight();
                }
            }
        }

        async function handleWolfExplode(playerId, context) {
            const player = findPlayerById(playerId);
            if (!player || !player.alive) return false;

            // 检查觉醒守卫保护
            const isAwakenGuardProtected = game.awakenGuard?.protectedTarget === playerId;
            if (isAwakenGuardProtected) {
                log(`【自爆】${player.id}${player.role} 自爆身份！`, 'wolf');
                log(`觉醒守卫保护生效，${player.id}免疫自爆出局，当前玩家重新计时发言`, 'skill');
                // 重置觉醒守卫保护
                if (game.awakenGuard) {
                    game.awakenGuard.protectedTarget = -1;
                    game.awakenGuard.nightUsed = false;
                }
                logAlive();
                return false;
            }

            player.alive = false;
            player.exploded = true; // 标记为自爆
            log(`【自爆】${player.id}${player.role} 自爆身份！`, 'wolf');

            // 狼人自曝的特殊处理
            if (ROLES[player.role]?.team === 'wolf') {
                // 预言家计分：第一天有狼人白天自曝+0.5
                if (game.day === 1) {
                    const seer = findPlayerByRole('预言家');
                    if (seer && seer.alive) {
                        addScore(seer.id, 'behaviorScore', 0.5, '第一天狼人自曝');
                    }
                    // 魔镜少女计分：存活时狼人自曝+0.5（上限+0.5）
                    const mirrorGirl = findPlayerByRole('魔镜少女');
                    if (mirrorGirl && mirrorGirl.alive) {
                        const ps = scoring.players[mirrorGirl.id];
                        if (ps && ps.behaviorScore < 0.5) {
                            addScore(mirrorGirl.id, 'behaviorScore', 0.5, '存活时狼人自曝');
                        }
                    }
                }

                // 白狼王自爆可带人
                if (player.role === '白狼王') {
                    const validTargets = getAlivePlayers();
                    if (validTargets.length > 0) {
                        const hint = `可选: ${validTargets.map(p => p.id).join(',')} (0=不带人)`;
                        const target = await getInput(`<${player.id}白狼王>自爆带人:`, hint, validTargets.map(p => p.id).concat([0]));
                        log(`<${player.id}白狼王>自爆带人:${target}`, 'input');
                        if (target > 0) {
                            const targetPlayer = findPlayerById(target);
                            if (targetPlayer) {
                                targetPlayer.alive = false;
                                log(`${targetPlayer.id}${targetPlayer.role} 被白狼王带走`, 'death');
                            }
                        }
                    }
                }

                // 赤月使徒自爆封印技能
                if (player.role === '赤月使徒') {
                    log(`赤月使徒自爆，当晚好人技能被封印！`, 'wolf');
                    game.bloodMoonSeal = true;
                }
            }

            // 处理殉情
            const deathDetails = [];
            await processCharmDeath(player, deathDetails);
            if (deathDetails.length > 0) {
                log(`连带死亡: ${deathDetails.join(' ')}`, 'death');
            }

            logAlive();

            if (context === 'police') {
                // 警长竞选期间自爆，不直接进入黑夜
                // 由 handlePoliceExplode 处理后续逻辑
                return true;
            }

            if (checkGameEnd()) return true;

            // 白天自爆后直接进入黑夜
            if (context === 'day') {
                log(`自爆后直接进入黑夜`, 'system');
                setTimeout(() => startNight(), 500);
            }

            return true;
        }

        // ==================== 投票环节 ====================
        async function votingPhase() {
            if (game.exploded || game.gameOver) return;
            
            // 检查绑票
            checkTieVote();

            const alivePlayers = getAlivePlayers();
            const playerList = alivePlayers.map(p => {
                let suffix = '';
                if (p.id === game.sheriff) suffix += '👑';
                if (p.cursed) suffix += '🪶';
                if (p.silenced) suffix += '🔇';
                return `${p.id}${p.role}${suffix}`;
            }).join(' ');
            
            let voteResult;
            let individualVotes = {}; // 记录每个人的投票
            
            // 详细投票模式（含投票分）
            if (scoring.enabled && scoring.withVote) {
                voteResult = await detailedVoting(alivePlayers);
                if (voteResult === -1) {
                    const wolves = getExplodableWolves();
                    const goodExploders = getExplodableGoodPlayers();
                    const allExploders = [...wolves, ...goodExploders];
                    if (allExploders.length > 0) {
                        const exploderHint = `选择自爆的玩家: ${allExploders.map(p => p.id).join(',')}`;
                        const exploderChoice = await getInput(`<自爆>选择玩家:`, exploderHint, allExploders.map(p => p.id));
                        await handleWolfExplode(exploderChoice, 'day');
                        return;
                    }
                }
            } else {
                const hint = `可选: ${alivePlayers.map(p => p.id).join(',')} (0=弃票/平票, -1=自爆)`;
                voteResult = await getInput(`<全体 ${playerList}>投票:`, hint, alivePlayers.map(p => p.id).concat([0, -1]));
            }

            if (voteResult === -1) {
                const wolves = getExplodableWolves();
                const goodExploders = getExplodableGoodPlayers();
                const allExploders = [...wolves, ...goodExploders];
                if (allExploders.length > 0) {
                    const exploderHint = `选择自爆的玩家: ${allExploders.map(p => p.id).join(',')}`;
                    const exploderChoice = await getInput(`<自爆>选择玩家:`, exploderHint, allExploders.map(p => p.id));
                    await handleWolfExplode(exploderChoice, 'day');
                    return;
                }
            }

            const voteTarget = voteResult;
            log(`<全体>投票:${voteTarget}`, 'input');
            hideExplodeButtons();
            hideDaySkillButtons();

            game.currentVoteTarget = voteTarget;

            if (voteTarget > 0) {
                const votedPlayer = findPlayerById(voteTarget);
                const awakenHiddenIsWhiteCat = votedPlayer?.role === '觉醒隐狼' && getAwakenHiddenLearnedRole() === '白猫' && !game.awakenHiddenWhiteCat?.extraLifeUsed;
                const awakenHiddenIsPufferfish = votedPlayer?.role === '觉醒隐狼' && getAwakenHiddenLearnedRole() === '河豚' && !game.awakenHiddenPufferfish?.used;
                const awakenHiddenIsWolfBeauty = votedPlayer?.role === '觉醒隐狼' && getAwakenHiddenLearnedRole() === '狼美人';
                
                // 白猫被投票 - 可以额外存活至下次投票后
                if ((votedPlayer.role === '白猫' && !game.whiteCat.extraLifeUsed) || awakenHiddenIsWhiteCat) {
                    if (awakenHiddenIsWhiteCat) {
                        game.awakenHiddenWhiteCat = game.awakenHiddenWhiteCat || { extraLifeUsed: false, extraLifeActive: false };
                        game.awakenHiddenWhiteCat.extraLifeUsed = true;
                        game.awakenHiddenWhiteCat.extraLifeActive = true;
                        log(`🐱 ${votedPlayer.id}觉醒隐狼 翻牌显示白猫并额外存活至下次放逐投票后`, 'skill');
                    } else {
                    game.whiteCat.extraLifeUsed = true;
                    game.whiteCat.extraLifeActive = true;
                    log(`🐱 ${votedPlayer.id}白猫 翻牌发动技能，额外存活至下次投票后`, 'skill');
                    }
                    logAlive();
                    if (!checkGameEnd()) startNight();
                    return;
                }
                
                // 检查白猫额外存活结束
                if (game.whiteCat.extraLifeActive) {
                    const whiteCat = findPlayerByRole('白猫');
                    if (whiteCat && whiteCat.alive) {
                        whiteCat.alive = false;
                        game.whiteCat.extraLifeActive = false;
                        log(`🐱 ${whiteCat.id}白猫 额外存活结束，出局`, 'death');
                    }
                }
                if (game.awakenHiddenWhiteCat?.extraLifeActive) {
                    const awakenHiddenWolf = findPlayerByRole('觉醒隐狼');
                    if (awakenHiddenWolf && awakenHiddenWolf.alive) {
                        awakenHiddenWolf.alive = false;
                        game.awakenHiddenWhiteCat.extraLifeActive = false;
                        log(`🐱 ${awakenHiddenWolf.id}觉醒隐狼(白猫) 额外存活结束，出局`, 'death');
                    }
                }
                if (votedPlayer) {
                    // 检查觉醒守卫保护
                    const isAwakenGuardProtected = game.awakenGuard?.protectedTarget === voteTarget;
                    if (isAwakenGuardProtected) {
                        log(`觉醒守卫保护生效，${votedPlayer.id}免疫放逐，平安日`, 'skill');
                        logAlive();
                        // 重置觉醒守卫保护
                        if (game.awakenGuard) {
                            game.awakenGuard.protectedTarget = -1;
                            game.awakenGuard.nightUsed = false;
                        }
                        if (!checkGameEnd()) startNight();
                        return;
                    }
                    
                    // 定序王子可重置投票
                    const prince = findPlayerByRole('定序王子');
                    if (prince && !game.prince.used) {
                        const resetChoice = await getInput(`<${prince.id}定序王子>是否重置投票? (1=是, 0=否):`, '', [0, 1]);
                        if (resetChoice === 1) {
                            game.prince.used = true;
                            log(`定序王子重置投票！`, 'skill');
                            showDaySkillButtons();
                            showExplodeButtons();
                            await votingPhase();
                            return;
                        }
                    }
                    
                    // 愚者被投票
                    if (votedPlayer.role === '愚者' && !votedPlayer.foolRevealed) {
                        const revealChoice = await getInput(`<${votedPlayer.id}愚者>是否翻牌免死? (1=是, 0=否):`, '', [0, 1]);
                        if (revealChoice === 1) {
                            votedPlayer.foolRevealed = true;
                            log(`${votedPlayer.id}愚者 翻牌免死，失去投票权`, 'good');
                            logAlive();
                            if (!checkGameEnd()) startNight();
                            return;
                        }
                    }
                    
                    // 觉醒狼美人被投票 - 首次出局由被魅惑者替代
                    if (votedPlayer.role === '觉醒狼美人') {
                        game.awakenBeauty = game.awakenBeauty || { shieldUsed: false, charmedTarget: -1 };
                        if (!game.awakenBeauty.shieldUsed && game.awakenBeauty.charmedTarget > 0) {
                            const charmedPlayer = findPlayerById(game.awakenBeauty.charmedTarget);
                            if (charmedPlayer && charmedPlayer.alive) {
                                game.awakenBeauty.shieldUsed = true;
                                log(`觉醒狼美人发动挽歌幻象！${charmedPlayer.id}${charmedPlayer.role}替代出局`, 'wolf');
                                charmedPlayer.alive = false;
                                log(`第${game.day}天死亡角色:${charmedPlayer.id}${charmedPlayer.role}(替代觉醒狼美人)`, 'death');
                                logAlive();
                                if (!checkGameEnd()) startNight();
                                return;
                            }
                        }
                    }
                    if (awakenHiddenIsWolfBeauty) {
                        game.awakenHiddenBeauty = game.awakenHiddenBeauty || { charmedTarget: -1, shieldUsed: false };
                        if (!game.awakenHiddenBeauty.shieldUsed && game.awakenHiddenBeauty.charmedTarget > 0) {
                            const charmedPlayer = findPlayerById(game.awakenHiddenBeauty.charmedTarget);
                            if (charmedPlayer && charmedPlayer.alive) {
                                game.awakenHiddenBeauty.shieldUsed = true;
                                log(`觉醒隐狼(狼美人)翻牌显示狼美人，${charmedPlayer.id}${charmedPlayer.role}替代出局`, 'wolf');
                                charmedPlayer.alive = false;
                                log(`第${game.day}天死亡角色:${charmedPlayer.id}${charmedPlayer.role}(替代觉醒隐狼狼美人)`, 'death');
                                logAlive();
                                if (!checkGameEnd()) startNight();
                                return;
                            }
                        }
                    }
                    
                    // 炸弹人被投票
                    if (votedPlayer.role === '炸弹人') {
                        log(`💣 炸弹人被放逐，所有投票者将被炸死！`, 'death');
                        const votersInput = await getInput(`输入投给炸弹人的玩家号码(逗号分隔):`, '', null, true);
                        if (votersInput) {
                            const voterIds = votersInput.split(/[,，]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                            for (const vid of voterIds) {
                                const voter = findPlayerById(vid);
                                if (voter && voter.alive && voter.id !== votedPlayer.id) {
                                    voter.alive = false;
                                    log(`${voter.id}${voter.role} 被炸弹人炸死`, 'death');
                                }
                            }
                        }
                    }
                    
                    // 河豚被投票
                    if ((votedPlayer.role === '河豚' && !game.pufferfish.used) || awakenHiddenIsPufferfish) {
                        // 河豚被猎人白天带走出局不会翻牌
                        if (votedPlayer.hunterKilled) {
                            log(`河豚被猎人带走，无法翻牌`, 'system');
                        } else if (votedPlayer.canFlip === false) {
                            // 夜间非狼刀出局，不能翻牌
                            log(`河豚夜间非狼刀出局，无法翻牌`, 'system');
                        } else {
                            if (awakenHiddenIsPufferfish) game.awakenHiddenPufferfish = game.awakenHiddenPufferfish || { used: false };
                            const pufferfishChoice = await getInput(`<${votedPlayer.id}河豚>是否翻牌带走投票者? (1=是, 0=否):`, '', [0, 1]);
                            if (pufferfishChoice === 1) {
                                if (awakenHiddenIsPufferfish) {
                                    game.awakenHiddenPufferfish.used = true;
                                    log(`觉醒隐狼翻牌显示河豚！所有投票者将被带走`, 'skill');
                                } else {
                                    game.pufferfish.used = true;
                                    log(`河豚翻牌！所有投票者将被带走`, 'skill');
                                }
                                // 简化处理：询问投票者
                                const votersInput = await getInput(`输入投给河豚的玩家号码(逗号分隔):`, '', null, true);
                                if (votersInput) {
                                    const voterIds = votersInput.split(/[,，]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                                    for (const vid of voterIds) {
                                        const voter = findPlayerById(vid);
                                        if (voter && voter.alive) {
                                            voter.alive = false;
                                            log(`${voter.id}${voter.role} 被河豚带走`, 'death');
                                        }
                                    }
                                }
                            }
                        }
                    }

                    votedPlayer.alive = false;
                    game.lastExiled = voteTarget;
                    const exileDisplayRole = votedPlayer.role === '觉醒隐狼' ? getDisplayRoleForChecks(votedPlayer) : votedPlayer.role;
                    log(`第${game.day}天死亡角色:${votedPlayer.id}${exileDisplayRole}`, 'death');

                    // 预言家计分：第一天有狼人白天被放逐+0.5
                    if (game.day === 1 && (ROLES[votedPlayer.role]?.team === 'wolf' || votedPlayer.isConvertedWolf)) {
                        const seer = findPlayerByRole('预言家');
                        if (seer && seer.alive) {
                            addScore(seer.id, 'behaviorScore', 0.5, '第一天狼人被放逐');
                        }
                        // 魔镜少女计分：存活时狼人被放逐+0.5（上限+0.5）
                        const mirrorGirl = findPlayerByRole('魔镜少女');
                        if (mirrorGirl && mirrorGirl.alive) {
                            const ps = scoring.players[mirrorGirl.id];
                            if (ps && ps.behaviorScore < 0.5) {
                                addScore(mirrorGirl.id, 'behaviorScore', 0.5, '存活时狼人被放逐');
                            }
                        }
                    }
                    
                    // 魔镜少女被放逐扣分-0.5
                    if (votedPlayer.role === '魔镜少女') {
                        addScore(votedPlayer.id, 'behaviorScore', -0.5, '被放逐');
                    }

                    // 野孩子榜样被放逐
                    if (game.wildChild.idol === voteTarget) {
                        const wildChild = findPlayerByRole('野孩子');
                        if (wildChild && wildChild.alive) {
                            log(`野孩子的榜样被放逐，野孩子变为狼人阵营！`, 'wolf');
                        }
                    }

                    // 狼王/猎人技能
                    if (votedPlayer.role === '狼王' || votedPlayer.role === '觉醒狼王' || votedPlayer.hasWolfClaw) {
                        await wolfKingSkill(votedPlayer);
                    }
                    
                    if (votedPlayer.role === '猎人' && !votedPlayer.poisoned) {
                        await hunterShoot(votedPlayer);
                    }
                    
                    // 觉醒猎人巡猎
                    if (votedPlayer.role === '觉醒猎人') {
                        await awakenHunterSkill(votedPlayer);
                    }

                    // 处理殉情
                    const deathDetails = [];
                    await processCharmDeath(votedPlayer, deathDetails);
                    if (deathDetails.length > 0) {
                        log(`连带死亡: ${deathDetails.join(' ')}`, 'death');
                    }
                }
            } else {
                log(`第${game.day}天死亡角色:无(弃票/平票)`, 'system');
            }

            // 处理老流氓延迟死亡
            const rogueDeaths = game.rogue.delayedDeath.filter(d => d.day === game.day);
            for (const rd of rogueDeaths) {
                const rogue = findPlayerById(rd.id);
                if (rogue && rogue.alive) {
                    rogue.alive = false;
                    log(`${rogue.id}老流氓 延迟死亡生效`, 'death');
                }
            }
            game.rogue.delayedDeath = game.rogue.delayedDeath.filter(d => d.day !== game.day);

            // 白天结束，重置觉醒守卫保护
            if (game.awakenGuard) {
                game.awakenGuard.protectedTarget = -1;
                game.awakenGuard.nightUsed = false;
            }
            
            logAlive();
            if (checkGameEnd()) return;
            startNight();
        }

        async function wolfKingSkill(player) {
            // 被毒、被梦游、被魅惑殉情、情侣殉情不能发动技能
            if (player.poisoned) {
                log(`<${player.id}${player.role}>被毒无法发动技能`, 'system');
                return;
            }
            if (player.dreamed) {
                log(`<${player.id}${player.role}>被摄梦出局无法发动技能`, 'system');
                return;
            }
            if (player.charmedDeath) {
                log(`<${player.id}${player.role}>被魅惑殉情无法发动技能`, 'system');
                return;
            }
            if (player.lovedDeath) {
                log(`<${player.id}${player.role}>情侣殉情无法发动技能`, 'system');
                return;
            }
            if (player.feared) {
                log(`<${player.id}${player.role}>被恐惧且夜间出局，无法发动技能`, 'system');
                return;
            }
            // 最后一狼不能发动技能
            const aliveWolves = getAliveWolves();
            if (aliveWolves.length === 0) {
                log(`<${player.id}${player.role}>作为最后一狼无法发动技能`, 'system');
                return;
            }
            
            const clawCount = player.role === '觉醒狼王' ? game.awakenWolfKing.claws : 1;
            
            for (let i = 0; i < clawCount; i++) {
                const validTargets = getAlivePlayers();
                if (validTargets.length > 0) {
                    const hint = `可选: ${validTargets.map(p => p.id).join(',')} (0=不带人)`;
                    const label = clawCount > 1 ? `带人${i+1}` : `带人`;
                    const shootTarget = await getInput(`<${player.id}${player.role}>${label}:`, hint, validTargets.map(p => p.id).concat([0]));
                    log(`<${player.id}${player.role}>${label}:${shootTarget}`, 'input');
                    if (shootTarget > 0) {
                        const shotPlayer = findPlayerById(shootTarget);
                        if (shotPlayer) {
                            shotPlayer.alive = false;
                            log(`${shotPlayer.id}${shotPlayer.role} 被狼王带走`, 'death');
                            // 狼王计分：带走带药女巫、守卫或摄梦人+0.5
                            if (shotPlayer.role === '女巫' && (game.witch.hasPoison || game.witch.hasAntidote)) {
                                addScore(player.id, 'behaviorScore', 0.5, '狼王爪带走带药女巫');
                            } else if (shotPlayer.role === '守卫') {
                                addScore(player.id, 'behaviorScore', 0.5, '狼王爪带走守卫');
                            } else if (shotPlayer.role === '摄梦人') {
                                addScore(player.id, 'behaviorScore', 0.5, '狼王爪带走摄梦人');
                            }
                        }
                    }
                }
            }
        }

        // ==================== 胜负判定 ====================
        function checkGameEnd() {
            const aliveWolves = getAliveWolves();
            const aliveGood = getAliveGoodPlayers();
            const aliveGods = getAliveGods();
            const aliveVillagers = getAliveVillagers();

            // 吹笛者胜利已在其行动中检查

            // 咒狐检查
            const fox = findPlayerByRole('咒狐');

            // 孤独少女检查 - 获取其暗恋对象的阵营
            const lonelyGirl = findPlayerByRole('孤独少女');
            let lonelyGirlWinTeam = null;
            if (lonelyGirl && lonelyGirl.alive && game.admirer && game.admirer.target > 0) {
                const adoreTarget = findPlayerById(game.admirer.target);
                if (adoreTarget) {
                    // 孤独少女本质属于民，胜利条件跟随崇拜对象
                    const adoreTeam = ROLES[adoreTarget.role]?.team;
                    if (adoreTeam === 'wolf' || adoreTarget.isConvertedWolf) {
                        lonelyGirlWinTeam = 'wolf';
                    } else if (adoreTeam === 'good') {
                        lonelyGirlWinTeam = 'good';
                    } else if (adoreTeam === 'third') {
                        // 如果崇拜对象是第三方（如丘比特阵营）
                        // 检查是否在链子中
                        if (game.lovers && game.lovers.includes(game.admirer.target)) {
                            // 崇拜对象在链子中，孤独少女也属于丘比特阵营
                            // 丘比特阵营获胜条件：所有非情侣出局
                            const lover1 = findPlayerById(game.lovers[0]);
                            const lover2 = findPlayerById(game.lovers[1]);
                            if (lover1 && lover2 && lover1.alive && lover2.alive) {
                                // 情侣都存活，检查是否只剩情侣+孤独少女
                                const aliveOthers = getAlivePlayers().filter(p => 
                                    p.id !== lover1.id && p.id !== lover2.id && p.id !== lonelyGirl.id
                                );
                                if (aliveOthers.length === 0) {
                                    lonelyGirlWinTeam = 'third'; // 丘比特阵营获胜
                                }
                            }
                        }
                    }
                }
            }

            // 检查狼人胜利条件（优先判断）
            let wolfWinCondition = null;
            for (const condition of game.config.winner) {
                if (condition === 'number' && aliveWolves.length >= aliveGood.length && aliveWolves.length > 0) {
                    wolfWinCondition = '数量压制';
                    break;
                }
                if (condition === 'edge' && (aliveGods.length === 0 || aliveVillagers.length === 0)) {
                    wolfWinCondition = '屠边';
                    break;
                }
                if (condition === 'city' && aliveGood.length === 0) {
                    wolfWinCondition = '屠城';
                    break;
                }
            }

            // 好人胜利条件：狼人全灭且好人有存活
            const goodWinCondition = aliveWolves.length === 0 && aliveGood.length > 0;

            // 当双方胜利条件同时满足时，狼人优先获胜
            if (wolfWinCondition && goodWinCondition) {
                // 双方同时满足，狼人优先
                if (fox && fox.alive) {
                    log('🦊 咒狐存活，咒狐单独获胜！', 'third');
                    const awakenHiddenWolf = findPlayerByRole('觉醒隐狼');
                    if (awakenHiddenWolf && awakenHiddenWolf.alive && getAwakenHiddenLearnedRole() === '咒狐') {
                        log('🦊 模仿咒狐的觉醒隐狼不会与咒狐一同获胜', 'system');
                    }
                    calculateFinalScores(null);
                } else if (lonelyGirlWinTeam === 'wolf') {
                    log(`🐺 游戏结束，狼人阵营${wolfWinCondition}获胜！(孤独少女跟随获胜)`, 'wolf');
                    calculateFinalScores('wolf');
                } else {
                    log(`🐺 游戏结束，狼人阵营${wolfWinCondition}获胜！`, 'wolf');
                    calculateFinalScores('wolf');
                }
                game.gameOver = true;
                hideInput();
                hideExplodeButtons();
                hideDaySkillButtons();
                if (scoring.enabled) showScorePanel();
                return true;
            }

            // 只有狼人胜利
            if (wolfWinCondition) {
                if (fox && fox.alive) {
                    log('🦊 咒狐存活，咒狐单独获胜！', 'third');
                    const awakenHiddenWolf = findPlayerByRole('觉醒隐狼');
                    if (awakenHiddenWolf && awakenHiddenWolf.alive && getAwakenHiddenLearnedRole() === '咒狐') {
                        log('🦊 模仿咒狐的觉醒隐狼不会与咒狐一同获胜', 'system');
                    }
                    calculateFinalScores(null);
                } else if (lonelyGirlWinTeam === 'wolf') {
                    log(`🐺 游戏结束，狼人阵营${wolfWinCondition}获胜！(孤独少女跟随获胜)`, 'wolf');
                    calculateFinalScores('wolf');
                } else {
                    log(`🐺 游戏结束，狼人阵营${wolfWinCondition}获胜！`, 'wolf');
                    calculateFinalScores('wolf');
                }
                game.gameOver = true;
                hideInput();
                hideExplodeButtons();
                hideDaySkillButtons();
                if (scoring.enabled) showScorePanel();
                return true;
            }

            // 只有好人胜利
            if (goodWinCondition) {
                if (fox && fox.alive) {
                    log('🦊 咒狐存活，咒狐单独获胜！', 'third');
                    const awakenHiddenWolf = findPlayerByRole('觉醒隐狼');
                    if (awakenHiddenWolf && awakenHiddenWolf.alive && getAwakenHiddenLearnedRole() === '咒狐') {
                        log('🦊 模仿咒狐的觉醒隐狼不会与咒狐一同获胜', 'system');
                    }
                    calculateFinalScores(null);
                } else if (lonelyGirlWinTeam === 'good') {
                    log('🎉 游戏结束，好人阵营获胜！(孤独少女跟随获胜)', 'good');
                    calculateFinalScores('good');
                } else {
                    log('🎉 游戏结束，好人阵营获胜！', 'good');
                    calculateFinalScores('good');
                }
                game.gameOver = true;
                hideInput();
                hideExplodeButtons();
                hideDaySkillButtons();
                if (scoring.enabled) showScorePanel();
                return true;
            }

            return false;
        }

        function logAlive() {
            const aliveDisplay = getAlivePlayers().map(p => {
                let suffix = '';
                if (p.id === game.sheriff) suffix += '👑';
                if (p.charmed) suffix += '💕';
                if (p.piperCharmed) suffix += '🎵';
                if (p.idiotRevealed) suffix += '🤡';
                if (p.cursed) suffix += '🪶';
                return `${p.id}${p.role}${suffix}`;
            }).join(' ');
            log(`当前存活角色:${aliveDisplay}`, 'system');
        }

        // ==================== 输入处理 ====================
        function getInput(prompt, hint, validOptions, freeInput = false) {
            return new Promise((resolve) => {
                const sortedOptions = validOptions ? [...validOptions].sort((a, b) => {
                    if (a === 0 || a === -1) return 1;
                    if (b === 0 || b === -1) return -1;
                    return a - b;
                }) : null;
                document.getElementById('inputArea').classList.remove('hidden');
                document.getElementById('inputPrompt').textContent = prompt;
                document.getElementById('inputHint').textContent = hint || (sortedOptions ? sortedOptions.join(', ') : '');
                document.getElementById('playerInput').value = '';
                document.getElementById('playerInput').focus();

                game.inputCallback = (value) => {
                    if (freeInput) {
                        resolve(value);
                        document.getElementById('inputArea').classList.add('hidden');
                        return;
                    }
                    const num = parseInt(value);
                    if (!isNaN(num) && validOptions && validOptions.includes(num)) {
                        resolve(num);
                        document.getElementById('inputArea').classList.add('hidden');
                    } else if (!validOptions) {
                        resolve(value);
                        document.getElementById('inputArea').classList.add('hidden');
                    } else {
                        alert(`无效输入，请输入: ${sortedOptions.join(', ')}`);
                        document.getElementById('playerInput').value = '';
                        document.getElementById('playerInput').focus();
                    }
                };
            });
        }
        function submitInput() {
            const value = document.getElementById('playerInput').value;
            if (game.inputCallback) {
                game.inputCallback(value);
            }
        }

        function hideInput() {
            document.getElementById('inputArea').classList.add('hidden');
        }

        function resetGame(clearLog = false) {
            document.getElementById('configPanel').classList.remove('hidden');
            document.getElementById('gameArea').classList.add('hidden');
            document.getElementById('scorePanel').classList.add('hidden');
            document.getElementById('showScoreBtn').classList.add('hidden');
            game.gameOver = true;
            if (clearLog) {
                document.getElementById('terminal').innerHTML = '';
                keepLog = false;
            } else {
                keepLog = true;
            }
            // 重置计分系统
            scoring = {
                enabled: false,
                withVote: false,
                continueAfterTie: false,
                tieDetected: false,
                players: {}
            };
        }

        function exportLog() {
            const terminal = document.getElementById('terminal');
            const logs = Array.from(terminal.children).map(div => div.textContent).join('\n');
            const blob = new Blob([logs], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `狼人杀记录_${new Date().toLocaleString().replace(/[/:]/g, '-')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 初始化
        initRoleSelector();
        quickConfig('9人标准');
    </script>
</body>
</html>
