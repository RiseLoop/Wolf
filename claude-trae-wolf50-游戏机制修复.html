        async function awakenHunterSkill(hunter) {
            const hint = `选择巡猎方向: 1=正序 2=逆序`;
            const dir = await getInput(`<${hunter.id}觉醒猎人>巡猎方向:`, hint, [1, 2]);
            log(`<${hunter.id}觉醒猎人>巡猎:${dir === 1 ? '正序' : '逆序'}`, 'input');
            const alivePlayers = getAlivePlayers();
            const hunterIndex = alivePlayers.findIndex(p => p.id === hunter.id);
            let found = null;
            if (dir === 1) {
                for (let i = hunterIndex + 1; i < alivePlayers.length; i++) {
                    if (ROLES[alivePlayers[i].role]?.team === 'wolf') { found = alivePlayers[i]; break; }
                }
                if (!found) {
                    for (let i = 0; i < hunterIndex; i++) {
                        if (ROLES[alivePlayers[i].role]?.team === 'wolf') { found = alivePlayers[i]; break; }
                    }
                }
            } else {
                for (let i = hunterIndex - 1; i >= 0; i--) {
                    if (ROLES[alivePlayers[i].role]?.team === 'wolf') { found = alivePlayers[i]; break; }
                }
                if (!found) {
                    for (let i = alivePlayers.length - 1; i > hunterIndex; i--) {
                        if (ROLES[alivePlayers[i].role]?.team === 'wolf') { found = alivePlayers[i]; break; }
                    }
                }
            }
            if (found) {
                found.alive = false;
                log(`觉醒猎人巡猎命中${found.id}${found.role}`, 'good');
            } else {
                log(`觉醒猎人未找到狼人`, 'system');
            }
        }

        async function awakenWhiteWolfKingAction() {
            const wolf = findPlayerByRole('觉醒白狼王');
            if (!wolf || !wolf.alive) return false;
            game.awakenWhiteWolf = game.awakenWhiteWolf || { used: false };
            if (game.awakenWhiteWolf.used) return false;
            const hint = `是否发动诱导? (1=是, 0=否)`;
            const choice = await getInput(`<${wolf.id}觉醒白狼王>诱导:`, hint, [0, 1]);
            if (choice === 1) {
                const validTargets = getAlivePlayers();
                const t = await getInput(`诱导目标:`, validTargets.map(p=>p.id).join(','), validTargets.map(p => p.id));
                log(`<${wolf.id}觉醒白狼王>诱导:${t}自曝`, 'input');
                const tp = findPlayerById(t);
                let isAwakenGuardProtected = false;
                if (tp) {
                    // 检查觉醒守卫保护
                    isAwakenGuardProtected = game.awakenGuard?.protectedTarget === t;
                    if (isAwakenGuardProtected) {
                        log(`${t}${tp.role}被诱导自曝！`, 'wolf');
                        log(`觉醒守卫保护生效，${t}免疫自曝出局，当前玩家重新计时发言`, 'skill');
                        // 重置觉醒守卫保护
                        if (game.awakenGuard) {
                            game.awakenGuard.protectedTarget = -1;
                            game.awakenGuard.nightUsed = false;
                        }
                        // 觉醒白狼王技能不消耗
                        return false;
                    } else {
                        tp.alive = false;
                        log(`${t}${tp.role}被诱导自曝`, 'death');
                        const targets2 = getAlivePlayers();
                        if (targets2.length > 0) {
                            const t2 = await getInput(`<${t}被诱导者>带人:`, targets2.map(p=>p.id).join(',')+'(0=不带)', targets2.map(p=>p.id).concat([0]));
                            if (t2 > 0) {
                                const tp2 = findPlayerById(t2);
                                if (tp2) { tp2.alive = false; log(`${t2}${tp2.role}被带走`, 'death'); }
                            }
                        }
                    }
                }
                // 只有在成功诱导自曝（目标未被保护）时才消耗技能
                if (!isAwakenGuardProtected && tp) {
                    game.awakenWhiteWolf.used = true;
                    return true;
                }
            }
            return false;
        }

        function processNightDeaths() {
            // 处理夜仆死亡
            if (game.noble.servant > 0) {
                const servant = findPlayerById(game.noble.servant);
                if (servant && servant.alive && servant.isServant) {
                    game.nightDeaths.push({ id: game.noble.servant, cause: 'servant' });
                    servant.isServant = false;
                    game.noble.servant = -1;
                }
            }
            
            // 流光伯爵保护
            const countProtected = game.count?.protectedTarget || -1;
            // 觉醒守卫保护
            const awakenGuardProtected = game.awakenGuard?.protectedTarget || -1;
            // 觉醒愚者保护
            const awakenFoolProtected = game.awakenFool?.protectTarget || -1;
            // 幸运儿守护（奇迹商人赠送）
            const giftProtected = game.giftProtected || -1;
            
            // 狼刀目标
            if (game.nightKillTarget > 0) {
                const targetPlayer = findPlayerById(game.nightKillTarget);
                if (targetPlayer) {
                    const isProtected = game.nightProtected === game.nightKillTarget;
                    // 同时检查原版摄梦人和觉醒隐狼(摄梦人)的保护
                    const isDreamProtected = game.nightDreamProtected === game.nightKillTarget || 
                                              game.awakenHiddenDreamProtected === game.nightKillTarget;
                    const isCountProtected = countProtected === game.nightKillTarget;
                    const isAwakenGuardProtected = awakenGuardProtected === game.nightKillTarget;
                    const isAwakenFoolProtected = awakenFoolProtected === game.nightKillTarget;
                    const isGiftProtected = giftProtected === game.nightKillTarget;
                    
                    // 恶夜骑士免疫狼刀
                    if (targetPlayer.role === '恶夜骑士') {
                        log(`恶夜骑士免疫狼刀`, 'skill');
                    }
                    // 咒狐免疫狼刀
                    else if (targetPlayer.role === '咒狐') {
                        log(`咒狐免疫狼刀`, 'skill');
                    }
                    // 觉醒守卫保护（完全免疫，包括免疫奶穿）
                    else if (isAwakenGuardProtected) {
                        log(`觉醒守卫保护生效，${targetPlayer.id}免疫伤害（免疫奶穿）`, 'skill');
                    }
                    // 觉醒愚者秘密之身保护
                    else if (isAwakenFoolProtected) {
                        log(`觉醒愚者秘密之身保护生效`, 'skill');
                        game.awakenFool.secretUsed = true;
                    }
                    // 流光伯爵保护
                    else if (isCountProtected) {
                        log(`流光伯爵庇护生效，${targetPlayer.id}免疫伤害`, 'skill');
                    }
                    // 同守同救规则 - 仅在没有觉醒守卫保护时才生效
                    else if (isProtected && game.nightSaved) {
                        game.nightDeaths.push({ id: game.nightKillTarget, cause: 'knife', note: '同守同救' });
                        // 守卫计分：同守同救好人-0.5（奶穿狼人不扣分）
                        if (ROLES[targetPlayer.role]?.team === 'good') {
                            const guard = findPlayerByRole('守卫');
                            if (guard) addScore(guard.id, 'behaviorScore', -0.5, '同守同救好人');
                        }
                    } 
                    // 正常保护检查
                    else if (!isProtected && !isDreamProtected && !game.nightSaved) {
                        game.nightDeaths.push({ id: game.nightKillTarget, cause: 'knife' });
                    } else {
                        // 被守卫或摄梦人或女巫救了
                        if (isProtected) {
                            log(`守卫守护生效`, 'skill');
                            // 守卫计分：守到一次被狼人刀的好人+0.5（上限+1）
                            if (ROLES[targetPlayer.role]?.team === 'good') {
                                const guard = findPlayerByRole('守卫');
                                if (guard) {
                                    game.guard.protectGoodScore = game.guard.protectGoodScore || 0;
                                    if (game.guard.protectGoodScore < 1) {
                                        addScore(guard.id, 'behaviorScore', 0.5, '守到被刀好人');
                                        game.guard.protectGoodScore += 0.5;
                                    }
                                }
                            }
                        }
                        if (isDreamProtected) {
                            log(`摄梦人梦游保护生效`, 'skill');
                            // 摄梦人计分：守到一次好人+0.5（上限+1）
                            if (ROLES[targetPlayer.role]?.team === 'good') {
                                const dreamer = findPlayerByRole('摄梦人');
                                if (dreamer) {
                                    game.dreamer.protectGoodScore = game.dreamer.protectGoodScore || 0;
                                    if (game.dreamer.protectGoodScore < 1) {
                                        addScore(dreamer.id, 'behaviorScore', 0.5, '梦游保护好人');
                                        game.dreamer.protectGoodScore += 0.5;
                                    }
                                }
                            } else if (ROLES[targetPlayer.role]?.team === 'wolf') {
                                // 摄梦人计分：梦游一个狼人+0.5（上限+1）
                                const dreamer = findPlayerByRole('摄梦人');
                                if (dreamer) {
                                    game.dreamer.protectGoodScore = game.dreamer.protectGoodScore || 0;
                                    if (game.dreamer.protectGoodScore < 1) {
                                        addScore(dreamer.id, 'behaviorScore', 0.5, '梦游狼人');
                                        game.dreamer.protectGoodScore += 0.5;
                                    }
                                }
                            }
                        }
                        if (game.nightSaved) log(`女巫解药生效`, 'skill');
                    }
                }
            }
            
            // 处理其他夜晚死亡时的觉醒守卫保护和觉醒隐狼加强版守护
            const newNightDeaths = [];
            // 死亡原因中文映射
            const deathCauseMap = {
                'poison': '毒药',
                'knife': '狼刀',
                'dream': '梦游',
                'evilKnightCounter': '恶夜骑士反伤',
                'pureGirl': '纯白之女查验',
                'wolfWitch': '狼巫查验',
                'demonHunter': '猎魔人狩猎',
                'demonHunterFail': '猎魔人狩猎失败',
                'merchantFail': '奇迹商人失败',
                'giftPoison': '幸运儿毒药',
                'awakenHiddenWolfKnife': '觉醒隐狼狼刀',
                'awakenHiddenWolfPoison': '觉醒隐狼毒药',
                'eclipseCounter': '流光反噬',
                'eclipseServantLucky': '蚀日侍女幸运儿技能',
                'awakenHiddenSeer': '觉醒隐狼(预言家)查验',
                'awakenHiddenAwakenSeer': '觉醒隐狼(觉醒预言家)查验',
                'seer': '预言家查验',
                'foolSeer': '愚言家查验',
                'giftSeer': '幸运儿查验',
                'awakenSeer': '觉醒预言家查验',
                'awakenDream': '觉醒摄梦人梦语'
            };
            
            for (const death of game.nightDeaths) {
                const isAwakenGuardProtected = game.awakenGuard?.protectedTarget === death.id;
                const isAwakenHiddenWolfProtected = game.awakenHidden?.protectedTarget === death.id;
                // 同时检查原版摄梦人、觉醒隐狼(摄梦人)、觉醒摄梦人的保护
                const isDreamProtected = game.nightDreamProtected === death.id || 
                                          game.awakenHiddenDreamProtected === death.id;
                const isAwakenDreamProtected = game.nightAwakenDreamProtected === death.id;
                const causeText = deathCauseMap[death.cause] || death.cause;
                if (isAwakenGuardProtected) {
                    const targetPlayer = findPlayerById(death.id);
                    if (targetPlayer) {
                        log(`觉醒守卫保护生效，${targetPlayer.id}免疫${causeText}伤害`, 'skill');
                    }
                    continue; // 跳过这个死亡，不加入新列表
                } else if (isAwakenHiddenWolfProtected) {
                    const targetPlayer = findPlayerById(death.id);
                    if (targetPlayer) {
                        log(`觉醒隐狼(守卫)加强版守护生效，${targetPlayer.id}免疫${causeText}伤害`, 'skill');
                    }
                    continue; // 跳过这个死亡，不加入新列表
                } else if (isDreamProtected) {
                    const targetPlayer = findPlayerById(death.id);
                    if (targetPlayer) {
                        log(`摄梦人梦游保护生效，${targetPlayer.id}免疫${causeText}伤害`, 'skill');
                        if (ROLES[targetPlayer.role]?.team === 'good') {
                            const dreamer = findPlayerByRole('摄梦人');
                            if (dreamer && game.dreamer.protectGoodScore < 1) {
                                addScore(dreamer.id, 'behaviorScore', 0.5, '梦游保护好人');
                                game.dreamer.protectGoodScore = (game.dreamer.protectGoodScore || 0) + 0.5;
                            }
                        } else if (ROLES[targetPlayer.role]?.team === 'wolf') {
                            const dreamer = findPlayerByRole('摄梦人');
                            if (dreamer && game.dreamer.protectGoodScore < 1) {
                                addScore(dreamer.id, 'behaviorScore', 0.5, '梦游保护狼人');
                                game.dreamer.protectGoodScore = (game.dreamer.protectGoodScore || 0) + 0.5;
                            }
                        }
                    }
                    continue;
                } else if (isAwakenDreamProtected && !death.ignoreProtect && death.cause !== 'awakenDream') {
                    const targetPlayer = findPlayerById(death.id);
                    if (targetPlayer) {
                        log(`觉醒摄梦人梦语保护生效，${targetPlayer.id}免疫${causeText}伤害`, 'skill');
                        const awakenDreamer = findPlayerByRole('觉醒摄梦人');
                        if (awakenDreamer) {
                            if (ROLES[targetPlayer.role]?.team === 'good' && !targetPlayer.isConvertedWolf) {
                                addScore(awakenDreamer.id, 'behaviorScore', 0.5, '梦语保护好人');
                            } else if (ROLES[targetPlayer.role]?.team === 'wolf' || targetPlayer.isConvertedWolf) {
                                addScore(awakenDreamer.id, 'behaviorScore', -0.5, '梦语保护狼人阵营角色');
                            }
                        }
                    }
                    continue;
                }
                newNightDeaths.push(death);
            }
            game.nightDeaths = newNightDeaths;
            
            // 重置保护状态 - 觉醒守卫的保护持续到白天结束，所以暂不重置
            if (game.count) game.count.protectedTarget = -1;
            if (game.awakenFool) game.awakenFool.protectTarget = -1;
            if (game.awakenHidden) game.awakenHidden.protectedTarget = -1;

            startDay();
        }

        // ==================== 白天阶段 ====================
        async function startDay() {
            game.phase = 'day';
            log(`════════ 第${game.day}天 ════════`, 'day');

            // 熊咆哮检测
            await bearCheck();

            // 警长竞选（在报死亡信息之前）
            // 第一天：正常竞选
            // 第二天：如果是双曝吞警徽且第一天有自曝，则继续竞选
            const needPoliceCampaign = game.config.policeRule !== 'none' && 
                (game.day === 1 || 
                 (game.day === 2 && game.config.policeRule === 'double' && game.policePhase?.firstExploded));
            
            if (needPoliceCampaign) {
                const result = await policeCampaign();
                
                // 处理单曝/双曝吞警徽的各种情况
                if (result === 'exploded_skip_day' || result === 'exploded_first_day' || result === 'exploded_second_day') {
                    // 先公布昨夜出局信息，再跳过白天放逐发言直接天黑
                    const settlement = await settleNightDeathsAtDawn();
                    if (settlement.gameEnded) return;
                    startNight();
                    return;
                } else if (result === 'exploded_day_continue') {
                    // 自曝者昨夜已死，继续白天放逐发言
                    // 继续执行下面的代码
                } else if (result === 'no_sheriff' || result === 'elected') {
                    // 正常流程，继续执行
                }
            }

            // 检查炼金魔女是否拥有法老之蛇（未使用）
            const alch = findPlayerByRole('炼金魔女');
            const hasAlchemistSnake = alch && alch.alive && game.alchemist && !game.alchemist.snakeUsed;
            
            if (hasAlchemistSnake) {
                // 炼金魔女拥有法老之蛇，先放逐发言，后公布出局信息
                log(`炼金魔女拥有法老之蛇，白天流程：先放逐发言，后公布出局信息`, 'skill');
                
                // 显示白天技能按钮和自爆按钮
                showDaySkillButtons();
                showExplodeButtons();
                
                // 先进行放逐发言和投票
                await votingPhase();
                
                // 投票结束后，炼金魔女决定是否使用法老之蛇救人
                const saved = await alchemistSnakeSave();
                
                // 然后公布出局信息
                const settlement = await settleNightDeathsAtDawn();
                if (settlement.gameEnded) return;
            } else {
                // 正常流程：先公布出局信息，后放逐发言
                const settlement = await settleNightDeathsAtDawn();
                if (settlement.gameEnded) return;

                // 显示白天技能按钮和自爆按钮
                showDaySkillButtons();
                showExplodeButtons();

                // 投票环节
                await votingPhase();
            }
        }

        async function settleNightDeathsAtDawn() {
            // 处理死亡
            const deathDetails = [];
            const uniqueDeaths = [];
            const seenIds = new Set();
            
            // 按号码排序
            game.nightDeaths.sort((a, b) => a.id - b.id);
            
            for (const death of game.nightDeaths) {
                if (!seenIds.has(death.id)) {
                    seenIds.add(death.id);
                    uniqueDeaths.push(death);
                }
            }

            // 检查炼金魔女是否使用了法老之蛇救人
            const snakeSavedTarget = game.alchemist?.snakeSaved ? game.alchemist.snakeTarget : null;

            for (const death of uniqueDeaths) {
                // 如果炼金魔女使用法老之蛇救了该玩家，跳过死亡处理
                if (snakeSavedTarget && death.id === snakeSavedTarget) {
                    log(`${death.id}号被法老之蛇救活，免于出局`, 'skill');
                    continue;
                }
                
                const player = findPlayerById(death.id);
                if (player && player.alive) {
                    player.alive = false;
                    let detail = `${player.id}${player.role}`;
                    if (death.note) detail += `(${death.note})`;
                    deathDetails.push(detail);
                    
                    // 狼王计分：被梦游出局、被毒出局-0.5
                    if (player.role === '狼王' || player.hasWolfClaw) {
                        if (death.cause === 'poison') {
                            addScore(player.id, 'behaviorScore', -0.5, '被毒出局');
                        } else if (death.cause === 'dream') {
                            addScore(player.id, 'behaviorScore', -0.5, '被梦游出局');
                        }
                    }
                    
                    // 河豚夜间出局处理：只有狼队爪击才能翻牌，其他方式出局不能翻牌
                    if (player.role === '河豚') {
                        if (death.cause === 'knife' || death.cause === 'awakenHiddenWolfKnife') {
                            // 狼队爪击，可以翻牌
                            player.canFlip = true;
                        } else {
                            // 其他方式出局（毒药、梦游、查验等），不能翻牌
                            player.canFlip = false;
                            log(`河豚因${deathCauseMap[death.cause] || death.cause}出局，无法翻牌`, 'system');
                        }
                    }

                    // 处理殉情
                    await processCharmDeath(player, deathDetails);
                }
            }

            if (deathDetails.length > 0) {
                log(`第${game.day}夜死亡角色:${deathDetails.join(' ')}`, 'death');
            } else {
                log(`第${game.day}夜死亡角色:平安夜`, 'system');
            }

            // 显示存活角色
            logAlive();

            if (checkGameEnd()) return { gameEnded: true, uniqueDeaths };

            // 猎人技能（夜晚死亡且非被毒）
            for (const death of uniqueDeaths) {
                const player = findPlayerById(death.id);
                if (player && player.role === '猎人' && death.cause !== 'poison') {
                    await hunterShoot(player);
                    if (checkGameEnd()) return { gameEnded: true, uniqueDeaths };
                }
                // 狼王/觉醒狼王夜晚死亡也能带人（非被毒）
                if (player && (player.role === '狼王' || player.role === '觉醒狼王' || player.hasWolfClaw) && death.cause !== 'poison') {
                    await wolfKingSkill(player);
                    if (checkGameEnd()) return { gameEnded: true, uniqueDeaths };
                }
                // 觉醒猎人夜晚死亡触发巡猎
                if (player && player.role === '觉醒猎人') {
                    await awakenHunterSkill(player);
                    if (checkGameEnd()) return { gameEnded: true, uniqueDeaths };
                }
                // 觉醒隐狼死亡时使用猎人技能
                if (player && player.role === '觉醒隐狼' && game.awakenHidden && game.awakenHidden.skillReady && game.awakenHidden.learnedRole === '猎人' && death.cause !== 'poison') {
                    await awakenHiddenWolfHunterSkill();
                    if (checkGameEnd()) return { gameEnded: true, uniqueDeaths };
                }
            }

            return { gameEnded: false, uniqueDeaths };
        }

        async function bearCheck() {
            const bear = findPlayerByRole('熊');
            const awakenHiddenWolf = findPlayerByRole('觉醒隐狼');
            const isAwakenHiddenBear = awakenHiddenWolf && getAwakenHiddenLearnedRole() === '熊';
            
            if (!bear && !isAwakenHiddenBear) return;
            
            // 检查觉醒隐狼是否模仿熊（视为场上有两只熊）
            let bear1HasWolf = false;
            let bear2HasWolf = false;
            let isBear1Converted = false;
            let isBear2Converted = false;
            
            // 第一只熊（真正的熊）
            if (bear) {
                const alivePlayers = getAlivePlayers();
                const bearIndex = alivePlayers.findIndex(p => p.id === bear.id);
                if (bearIndex !== -1) {
                    const prevIndex = (bearIndex - 1 + alivePlayers.length) % alivePlayers.length;
                    const nextIndex = (bearIndex + 1) % alivePlayers.length;
                    const neighbors = [alivePlayers[prevIndex], alivePlayers[nextIndex]];
                    isBear1Converted = bear.isConvertedWolf;
                    bear1HasWolf = neighbors.some(p => getBearNeighborWolfState(p));
                }
            }
            
            // 第二只熊（觉醒隐狼模仿的熊）
            if (isAwakenHiddenBear && awakenHiddenWolf) {
                const alivePlayers = getAlivePlayers();
                const bearIndex = alivePlayers.findIndex(p => p.id === awakenHiddenWolf.id);
                if (bearIndex !== -1) {
                    const prevIndex = (bearIndex - 1 + alivePlayers.length) % alivePlayers.length;
                    const nextIndex = (bearIndex + 1) % alivePlayers.length;
                    const neighbors = [alivePlayers[prevIndex], alivePlayers[nextIndex]];
                    isBear2Converted = awakenHiddenWolf.isConvertedWolf;
                    bear2HasWolf = neighbors.some(p => getBearNeighborWolfState(p));
                }
            }
            
            // 判断咆哮逻辑
            // 如果熊是转化者且身边没有狼人，熊不会咆哮
            const bear1Roars = bear && (!isBear1Converted || bear1HasWolf) && bear1HasWolf;
            const bear2Roars = isAwakenHiddenBear && (!isBear2Converted || bear2HasWolf) && bear2HasWolf;
            
            // 无论哪只熊达到咆哮条件，都会公示熊咆哮了
            if (bear1Roars || bear2Roars) {
                if (isAwakenHiddenBear) {
                    log(`🐻 熊咆哮了！(场上有两只熊，至少一只达到咆哮条件)`, 'skill');
                } else {
                    log(`🐻 熊咆哮了！`, 'skill');
                }
            } else {
                if (isBear1Converted && !bear1HasWolf) {
                    log(`🐻 熊没有咆哮（熊是转化者，身边没有狼人）`, 'system');
                } else if (isAwakenHiddenBear) {
                    log(`🐻 熊没有咆哮(两只熊都未达到咆哮条件)`, 'system');
                } else {
                    log(`🐻 熊没有咆哮`, 'system');
                }
            }
        }

        async function processCharmDeath(player, deathDetails) {
            // 狼美人死亡，被魅惑者殉情（单向连接：狼美人死→魅惑对象死，反过来不成立）
            if (player.role === '狼美人') {
                // 检查是否因被决斗而导致技能失效
                if (game.wolfBeauty && game.wolfBeauty.charmInvalid) {
                    log(`狼美人魅惑技能已失效（被骑士决斗），不触发殉情`, 'system');
                    return;
                }
                
                // 只有昨晚被魅惑的玩家殉情
                const lastCharmed = game.wolfBeauty.lastCharmed;
                if (lastCharmed > 0) {
                    const cp = findPlayerById(lastCharmed);
                    if (cp && cp.alive && cp.charmed) {
                        cp.alive = false;
                        cp.charmedDeath = true; // 标记为魅惑殉情
                        deathDetails.push(`${cp.id}${cp.role}(殉情)`);
                    }
                }
            }
            
            // 注意：被魅惑者死亡，狼美人不会死（单向连接）
            // 已删除原有的反向殉情逻辑

            // 摄梦人死亡，当晚梦游者也出局
            if (player.role === '摄梦人' && game.phase === 'night') {
                const dreamTarget = game.nightDreamProtected;
                if (dreamTarget > 0) {
                    const dreamer = findPlayerById(dreamTarget);
                    if (dreamer && dreamer.alive) {
                        dreamer.alive = false;
                        dreamer.dreamed = true; // 标记为被摄梦出局
                        deathDetails.push(`${dreamer.id}${dreamer.role}(摄梦人死亡连带)`);
                    }
                }
            }

            // 情侣殉情
            if (game.lovers && game.lovers.includes(player.id)) {
                const otherId = game.lovers.find(id => id !== player.id);
                const other = findPlayerById(otherId);
                if (other && other.alive) {
                    other.alive = false;
                    other.lovedDeath = true; // 标记为情侣殉情
                    deathDetails.push(`${other.id}${other.role}(情侣殉情)`);
                }
            }

            // 野孩子榜样死亡变狼
            if (game.wildChild.idol === player.id) {
                const wildChild = findPlayerByRole('野孩子');
                if (wildChild && wildChild.alive) {
                    // 野孩子变成狼人
                    wildChild.role = '狼人';
                    game.wildChild.transformed = true;
                    log(`野孩子的榜样出局，野孩子变为狼人！`, 'wolf');
                }
            }
            
            // 觉醒孤独少女的偶像出局处理
            if (game.awakenAdmirer && game.awakenAdmirer.idol === player.id) {
                const admirer = findPlayerByRole('觉醒孤独少女');
                if (admirer && admirer.alive) {
                    // 检查出局原因：被放逐则变狼，其他原因则继承身份
                    if (game.phase === 'day' && game.lastExiled === player.id) {
                        admirer.role = '狼人';
                        log(`觉醒孤独少女的偶像被放逐，觉醒孤独少女变为狼人！`, 'wolf');
                    } else {
                        log(`觉醒孤独少女继承偶像${player.role}的身份！`, 'skill');
                        // 继承身份的复杂逻辑简化处理
                    }
                }
            }

            // 寻香魅影殉情逻辑
            if (game.scentShadow && game.scentShadow.bound) {
                const [bound1, bound2] = game.scentShadow.bound;
                if (player.id === bound1) {
                    const other = findPlayerById(bound2);
                    if (other && other.alive) {
                        other.alive = false;
                        deathDetails.push(`${other.id}${other.role}(寻香魅影殉情)`);
                        log(`寻香魅影技能生效，${bound1}号出局导致${bound2}号殉情`, 'skill');
                    }
                } else if (player.id === bound2) {
                    const other = findPlayerById(bound1);
                    if (other && other.alive) {
                        other.alive = false;
                        deathDetails.push(`${other.id}${other.role}(寻香魅影殉情)`);
                        log(`寻香魅影技能生效，${bound2}号出局导致${bound1}号殉情`, 'skill');
                    }
                }
            }
        }

        async function hunterShoot(hunter) {
            // 被毒、被梦游、被魅惑殉情、情侣殉情不能开枪
            if (hunter.poisoned) {
                log(`<${hunter.id}猎人>被毒无法开枪`, 'system');
                return;
            }
            if (hunter.dreamed) {
                log(`<${hunter.id}猎人>被摄梦出局无法开枪`, 'system');
                return;
            }
            if (hunter.charmedDeath) {
                log(`<${hunter.id}猎人>被魅惑殉情无法开枪`, 'system');
                return;
            }
            if (hunter.lovedDeath) {
                log(`<${hunter.id}猎人>情侣殉情无法开枪`, 'system');
                return;
            }
            if (hunter.feared) {
                log(`<${hunter.id}猎人>被恐惧且夜间出局，无法开枪`, 'system');
                return;
            }
            
            const validTargets = getAlivePlayers();
            if (validTargets.length > 0) {
                const hint = `可选: ${validTargets.map(p => p.id).join(',')} (0=不开枪)`;
                const shootTarget = await getInput(`<${hunter.id}猎人>开枪:`, hint, validTargets.map(p => p.id).concat([0]));
                log(`<${hunter.id}猎人>开枪:${shootTarget}`, 'input');
                if (shootTarget > 0) {
                    const shotPlayer = findPlayerById(shootTarget);
                    if (shotPlayer) {
                        // 猎人计分：捕猎狼人+1，捕猎好人-1
                        if (ROLES[shotPlayer.role]?.team === 'wolf') {
                            addScore(hunter.id, 'behaviorScore', 1, '捕猎狼人');
                        } else if (ROLES[shotPlayer.role]?.team === 'good') {
                            addScore(hunter.id, 'behaviorScore', -1, '捕猎好人');
                        }
                        
                        // 老流氓被射杀延迟死亡
                        if (shotPlayer.role === '老流氓') {
                            shotPlayer.delayedDeath = true;
                            game.rogue.delayedDeath.push({ id: shootTarget, day: game.day + 1 });
                            log(`老流氓被射杀，延迟一天死亡`, 'skill');
                        } else if (shotPlayer.role === '河豚') {
                            // 河豚被猎人白天带走出局不会翻牌
                            shotPlayer.alive = false;
                            shotPlayer.hunterKilled = true; // 标记被猎人带走，不能翻牌
                            log(`${shotPlayer.id}${shotPlayer.role} 被猎人带走`, 'death');
                            log(`河豚被猎人带走，无法翻牌`, 'system');
                        } else {
                            shotPlayer.alive = false;
                            log(`${shotPlayer.id}${shotPlayer.role} 被猎人带走`, 'death');
                            // 猎人带走的人如果是狼王/猎人，触发连锁
                            if (shotPlayer.role === '狼王' || shotPlayer.hasWolfClaw) {
                                await wolfKingSkill(shotPlayer);
                            }
                            if (shotPlayer.role === '猎人' && !shotPlayer.poisoned) {
                                await hunterShoot(shotPlayer);
                            }
                        }
                        logAlive();
                    }
                }
            }
        }

                const shootTarget = await getInput(`<${awakenHiddenWolf.id}觉醒隐狼(猎人)>开枪:`, hint, validTargets.map(p => p.id).concat([0]));
                log(`<${awakenHiddenWolf.id}觉醒隐狼(猎人)>开枪:${shootTarget}`, 'input');
                if (shootTarget > 0) {
                    const shotPlayer = findPlayerById(shootTarget);
                    if (shotPlayer) {

                        if (ROLES[shotPlayer.role]?.team === 'good') {
                            addScore(awakenHiddenWolf.id, 'behaviorScore', 0.5, '模仿猎人捕猎好人');
                        } else if (ROLES[shotPlayer.role]?.team === 'wolf' || shotPlayer.isConvertedWolf) {
                            addScore(awakenHiddenWolf.id, 'behaviorScore', -0.5, '模仿猎人捕猎狼人');
                        }
                        
                        // 老流氓被射杀延迟死亡
                        if (shotPlayer.role === '老流氓') {
                            shotPlayer.delayedDeath = true;
                            game.rogue.delayedDeath.push({ id: shootTarget, day: game.day + 1 });
                            log(`老流氓被射杀，延迟一天死亡`, 'skill');
                        } else {
                            shotPlayer.alive = false;
                            log(`${shotPlayer.id}${shotPlayer.role} 被觉醒隐狼(猎人)带走`, 'death');
                            // 带走的人如果是狼王/猎人，触发连锁
                            if (shotPlayer.role === '狼王' || shotPlayer.hasWolfClaw) {
                                await wolfKingSkill(shotPlayer);
                            }
                            if (shotPlayer.role === '猎人' && !shotPlayer.poisoned) {
                                await hunterShoot(shotPlayer);
                            }
                        }
                        logAlive();
                    }
                }
            }
            game.awakenHidden.hasGun = false;
        }

        // ==================== 警长竞选 ====================
        async function policeCampaign() {
            log(`【警长竞选】`, 'police');
            
            // 标记当前在警长竞选期间
            game.inPoliceCampaign = true;
            
            try {
                // 初始化双曝吞警徽状态（仅第一天且未初始化时）
                if (game.day === 1 && (!game.policePhase || typeof game.policePhase !== 'object')) {
                    game.policePhase = { 
                        day: 1, 
                        explodedCount: 0, 
                        firstExploded: false,
                        candidates: []
                    };
                }
                
                const alivePlayers = getAlivePlayers();
                
                // 第一天：收集上警玩家
                // 第二天：如果是双曝吞警徽且第一天有自曝，则继续竞选
                const isFirstDayCampaign = game.day === 1;
                const isSecondDayContinue = game.day === 2 && game.config.policeRule === 'double' && game.policePhase?.firstExploded;
            
                if (isFirstDayCampaign) {
                    // 第一天正常竞选：询问谁上警
                    const hint = `输入上警玩家号码(逗号分隔), 0=无人上警`;
                    const candidatesInput = await getInput(`<上警>请输入参选玩家:`, hint, null, true);
                    
                    if (candidatesInput === '0' || !candidatesInput.trim()) {
                        log(`无人上警，本局无警长`, 'police');
                        return 'no_sheriff';
                    }

                    const candidateIds = candidatesInput.split(/[,，]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                    game.policePhase.candidates = candidateIds.filter(id => findPlayerById(id)?.alive);
                    game.sheriffCandidates = [...game.policePhase.candidates];
                    
                    if (game.sheriffCandidates.length === 0) {
                        log(`无有效候选人，本局无警长`, 'police');
                        return 'no_sheriff';
                    }

                    log(`上警玩家: ${game.sheriffCandidates.join(',')}`, 'police');

                    // 发言阶段可能有玩家自爆（使用输入式询问，不显示按钮）
                    const explodePlayerId = await checkExplodeDuringPolice('发言');
                    if (explodePlayerId > 0) {
                        // 处理自曝后的逻辑
                        return await handlePoliceExplode(explodePlayerId);
                    }
                    
                    // 第一天也有退水环节
                    const withdrawInput = await getInput(`<退水>输入退水玩家(逗号分隔,0=无):`, `当前候选: ${game.sheriffCandidates.join(',')}`, null, true);
                    if (withdrawInput && withdrawInput !== '0') {
                        const withdrawIds = withdrawInput.split(/[,，]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                        game.sheriffCandidates = game.sheriffCandidates.filter(id => !withdrawIds.includes(id));
                        game.policePhase.candidates = game.policePhase.candidates.filter(id => !withdrawIds.includes(id));
                        log(`退水后候选人: ${game.sheriffCandidates.length > 0 ? game.sheriffCandidates.join(',') : '无'}`, 'police');
                    }

                    // 退水环节自爆检查（使用输入式询问，不显示按钮）
                    const withdrawExplodePlayerId = await checkExplodeDuringPolice('退水');
                    if (withdrawExplodePlayerId > 0) {
                        return await handlePoliceExplode(withdrawExplodePlayerId);
                    }
                } else if (isSecondDayContinue) {
                    // 第二天继续竞选：恢复上警玩家列表
                    game.sheriffCandidates = game.policePhase.candidates.filter(id => {
                        const p = findPlayerById(id);
                        return p && p.alive;
                    });
                    
                    if (game.sheriffCandidates.length === 0) {
                        log(`所有候选人已出局，警徽流失`, 'police');
                        return 'no_sheriff';
                    }
                    
                    log(`第二天竞选，上警玩家: ${game.sheriffCandidates.join(',')}`, 'police');
                    
                    // 第二天退水环节
                    const withdrawInput2 = await getInput(`<退水>输入退水玩家(逗号分隔,0=无):`, `当前候选: ${game.sheriffCandidates.join(',')}`, null, true);
                    if (withdrawInput2 && withdrawInput2 !== '0') {
                        const withdrawIds2 = withdrawInput2.split(/[,，]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                        game.sheriffCandidates = game.sheriffCandidates.filter(id => !withdrawIds2.includes(id));
                        game.policePhase.candidates = game.policePhase.candidates.filter(id => !withdrawIds2.includes(id));
                        log(`退水后候选人: ${game.sheriffCandidates.length > 0 ? game.sheriffCandidates.join(',') : '无'}`, 'police');
                    }

                    // 退水环节自爆检查（使用输入式询问，不显示按钮）
                    const withdrawExplodePlayerId2 = await checkExplodeDuringPolice('退水');
                    if (withdrawExplodePlayerId2 > 0) {
                        return await handlePoliceExplode(withdrawExplodePlayerId2);
                    }
                }

                // 检查候选人数量
                if (game.sheriffCandidates.length === 0) {
                    log(`所有候选人退水/出局，警徽流失`, 'police');
                    return 'no_sheriff';
                }

                // 只剩一名候选人，自动当选
                if (game.sheriffCandidates.length === 1) {
                    game.sheriff = game.sheriffCandidates[0];
                    const sheriffPlayer = findPlayerById(game.sheriff);
                    log(`${game.sheriff}${sheriffPlayer.role} 自动当选警长`, 'police');
                    
                    // 狼人警徽分：狼人阵营获得警徽+0.5
                    if (ROLES[sheriffPlayer.role]?.team === 'wolf' || sheriffPlayer.isConvertedWolf) {
                        addScore(game.sheriff, 'policeScore', 0.5, '狼人获得警徽');
                    }
                    // 预言家、魔镜少女警徽分：获得警徽+0.5
                    if (sheriffPlayer.role === '预言家' || sheriffPlayer.role === '魔镜少女') {
                        addScore(game.sheriff, 'policeScore', 0.5, '获得警徽');
                    }
                    
                    return 'elected';
                }

                // 投票环节
                const hint2 = `候选人: ${game.sheriffCandidates.join(',')} (0=平票/流失)`;
                const sheriffVote = await getInput(`<警长投票>:`, hint2, game.sheriffCandidates.concat([0]));
                
                if (sheriffVote === 0) {
                    // 平票，进入发言环节
                    log(`警长投票平票，进入平票发言环节`, 'police');
                    
                    // 平票发言阶段自爆检查（使用输入式询问，不显示按钮）
                    const explodePlayerId = await checkExplodeDuringPolice('平票发言');
                    if (explodePlayerId > 0) {
                        return await handlePoliceExplode(explodePlayerId);
                    }
                    
                    log(`平票发言结束，警徽流失`, 'police');
                    return 'no_sheriff';
                }

                game.sheriff = sheriffVote;
                const sheriffPlayer = findPlayerById(game.sheriff);
                log(`${game.sheriff}${sheriffPlayer.role} 当选警长`, 'police');
                
                // 狼人警徽分：狼人阵营获得警徽+0.5
                if (ROLES[sheriffPlayer.role]?.team === 'wolf' || sheriffPlayer.isConvertedWolf) {
                    addScore(game.sheriff, 'policeScore', 0.5, '狼人获得警徽');
                }
                // 预言家、魔镜少女警徽分：获得警徽+0.5
                if (sheriffPlayer.role === '预言家' || sheriffPlayer.role === '魔镜少女') {
                    addScore(game.sheriff, 'policeScore', 0.5, '获得警徽');
                }
                
                return 'elected';
            } finally {
                // 清除警长竞选期间标记
                game.inPoliceCampaign = false;
            }
        }

        // 处理警长竞选中的自曝
        async function handlePoliceExplode(exploderId) {
            const exploder = findPlayerById(exploderId);
            if (!exploder) return 'exploded';
            
            if (!game.policePhase || typeof game.policePhase !== 'object') {
                game.policePhase = {
                    day: game.day,
                    explodedCount: 0,
                    firstExploded: false,
                    candidates: [...game.sheriffCandidates]
                };
            }
            game.policePhase.explodedCount++;
            
            // 单曝吞警徽
            if (game.config.policeRule === 'single') {
                game.sheriff = -1;
                log(`单曝吞警徽！警徽流失`, 'police');
                
                // 检查自曝者昨夜是否已死
                const diedLastNight = game.nightDeaths.some(d => d.id === exploder.id);
                
                if (diedLastNight) {
                    // 昨夜已死，公布信息后进入白天放逐发言
                    log(`自曝者昨夜已出局，进入白天放逐发言阶段`, 'system');
                    return 'exploded_day_continue';
                } else {
                    // 昨夜未死，跳过放逐发言直接天黑
                    log(`自曝者昨夜未出局，跳过放逐发言直接天黑`, 'system');
                    return 'exploded_skip_day';
                }
            }
            
            // 双曝吞警徽
            if (game.config.policeRule === 'double') {
                if (game.policePhase.day === 1) {
                    // 第一天自曝
                    game.policePhase.firstExploded = true;
                    game.policePhase.day = 2;
                    log(`第一天警上自曝，保存上警信息，公布出局信息后直接进入黑夜`, 'police');
                    return 'exploded_first_day';
                } else if (game.policePhase.day === 2) {
                    // 第二天自曝
                    game.sheriff = -1;
                    log(`第二天自曝，警徽流失，公布出局信息后直接进入黑夜`, 'police');
                    return 'exploded_second_day';
                }
            }
            
            return 'exploded';
        }

        async function checkExplodeDuringPolice(phase) {
            const explodableWolves = getExplodableWolves();
            const explodableGoodPlayers = getExplodableGoodPlayers();
            const allExploders = [...explodableWolves, ...explodableGoodPlayers];
            
            let hint;
            let validOptions = [0];
            
            if (allExploders.length > 0) {
                hint = `可自爆玩家: ${allExploders.map(p => p.id).join(',')} (0=不自爆)`;
                validOptions = allExploders.map(p => p.id).concat([0]);
            } else {
                hint = `无可自爆玩家 (输入0继续)`;
            }
            
            const explodeChoice = await getInput(`<${phase}阶段>是否有玩家自爆:`, hint, validOptions);
            
            if (explodeChoice > 0) {
                const exploded = await handleWolfExplode(explodeChoice, 'police');
                return exploded ? explodeChoice : 0;
            }
            return 0;
        }
